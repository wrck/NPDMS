  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;project-stage-workbinding-wireframe&quot;&gt;
  &lt;style&gt;
    #project-stage-workbinding-wireframe { color: var(--foreground); }
    #project-stage-workbinding-wireframe .project-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    #project-stage-workbinding-wireframe .workspace { display: grid; grid-template-columns: minmax(180px, 0.9fr) minmax(0, 2.4fr); gap: 28px; align-items: start; }
    #project-stage-workbinding-wireframe nav, #project-stage-workbinding-wireframe main { min-width: 0; }
    #project-stage-workbinding-wireframe .nav-heading { margin: 16px 0 8px; font-weight: 500; }
    #project-stage-workbinding-wireframe .overview-items { display: grid; gap: 8px; padding: 12px 0 0 16px; }
    #project-stage-workbinding-wireframe .nav-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; justify-items: start; gap: 4px; margin: 4px 0; }
    #project-stage-workbinding-wireframe .task-branch { margin-left: 16px; }
    #project-stage-workbinding-wireframe .nav-spacer { width: 24px; }
    #project-stage-workbinding-wireframe .content-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    #project-stage-workbinding-wireframe .content-title { margin: 0; }
    #project-stage-workbinding-wireframe .stage-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 16px; }
    #project-stage-workbinding-wireframe .task-cell { display: flex; align-items: center; gap: 4px; }
    #project-stage-workbinding-wireframe .toggle-slot { display: inline-flex; flex: 0 0 32px; }
    #project-stage-workbinding-wireframe .task-indent { margin-left: 20px; }
    #project-stage-workbinding-wireframe .meta-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 0 0 20px; }
    #project-stage-workbinding-wireframe .meta-list dt { color: var(--muted-foreground); }
    #project-stage-workbinding-wireframe .meta-list dd { margin: 4px 0 0; overflow-wrap: anywhere; }
    #project-stage-workbinding-wireframe .section-label { margin: 20px 0 10px; font-weight: 500; }
    #project-stage-workbinding-wireframe .field-stack { display: grid; gap: 12px; }
    #project-stage-workbinding-wireframe .field-value { margin-bottom: 8px; }
    #project-stage-workbinding-wireframe .mode-label { color: var(--muted-foreground); }
    #project-stage-workbinding-wireframe summary { cursor: pointer; }
    #project-stage-workbinding-wireframe [hidden] { display: none !important; }
    @media (max-width: 560px) {
      #project-stage-workbinding-wireframe .workspace { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      #project-stage-workbinding-wireframe .meta-list { grid-template-columns: minmax(0, 1fr); }
    }
  &lt;/style&gt;

  &lt;div class=&quot;project-heading&quot;&gt;
    &lt;span&gt;示例项目 / PJ-001&lt;/span&gt;
    &lt;span class=&quot;text-small text-muted&quot;&gt;冻结模板：示例模板 R1&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;workspace&quot;&gt;
    &lt;nav aria-label=&quot;项目阶段与任务导航&quot;&gt;
      &lt;details&gt;
        &lt;summary&gt;项目概览 · 六个入口&lt;/summary&gt;
        &lt;div class=&quot;overview-items text-small&quot;&gt;
          &lt;span&gt;基本信息&lt;/span&gt;&lt;span&gt;项目树&lt;/span&gt;&lt;span&gt;项目成员&lt;/span&gt;
          &lt;span&gt;项目任务 / WBS&lt;/span&gt;&lt;span&gt;设备清单&lt;/span&gt;&lt;span&gt;实施范围&lt;/span&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;div class=&quot;nav-heading&quot;&gt;交付流程&lt;/div&gt;
      &lt;div id=&quot;wireframe-navigation&quot;&gt;&lt;/div&gt;
    &lt;/nav&gt;
    &lt;main id=&quot;wireframe-content&quot; aria-label=&quot;当前阶段或任务内容&quot; aria-live=&quot;polite&quot;&gt;&lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;project-stage-workbinding-wireframe&#x27;);
      const nav = root.querySelector(&#x27;#wireframe-navigation&#x27;);
      const content = root.querySelector(&#x27;#wireframe-content&#x27;);
      const stages = [
        { id: &#x27;S0&#x27;, name: &#x27;项目基本操作&#x27;, tasks: [] },
        { id: &#x27;S1&#x27;, name: &#x27;工前准备&#x27;, tasks: [
          { id: &#x27;survey&#x27;, code: &#x27;T-01&#x27;, name: &#x27;现场工勘&#x27;, status: &#x27;进行中&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;工勘业务页面&#x27;, children: [
            { id: &#x27;survey-a&#x27;, code: &#x27;T-01.1&#x27;, name: &#x27;A站点工勘&#x27;, status: &#x27;进行中&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;工勘业务页面&#x27; },
            { id: &#x27;survey-b&#x27;, code: &#x27;T-01.2&#x27;, name: &#x27;B站点工勘&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员丙&#x27;, view: &#x27;工勘业务页面&#x27; }
          ] },
          { id: &#x27;requirement&#x27;, code: &#x27;T-02&#x27;, name: &#x27;需求分析&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;需求分析表单&#x27; }
        ] },
        { id: &#x27;S2&#x27;, name: &#x27;施工计划&#x27;, workBindingView: &#x27;项目工期&#x27;, tasks: [{ id: &#x27;plan&#x27;, code: &#x27;T-03&#x27;, name: &#x27;施工计划制定&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;施工计划办理页面&#x27; }] },
        { id: &#x27;S3&#x27;, name: &#x27;实施方案&#x27;, tasks: [{ id: &#x27;solution&#x27;, code: &#x27;T-04&#x27;, name: &#x27;实施方案编审&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;实施方案办理页面&#x27; }] },
        { id: &#x27;S4&#x27;, name: &#x27;实施部署&#x27;, tasks: [{ id: &#x27;install&#x27;, code: &#x27;T-05&#x27;, name: &#x27;硬件安装&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;硬件安装业务页面&#x27; }] },
        { id: &#x27;S5&#x27;, name: &#x27;验收交维&#x27;, tasks: [{ id: &#x27;acceptance&#x27;, code: &#x27;T-06&#x27;, name: &#x27;验收办理&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;验收报告业务页面&#x27; }] },
        { id: &#x27;S6&#x27;, name: &#x27;项目闭环&#x27;, tasks: [{ id: &#x27;closure&#x27;, code: &#x27;T-07&#x27;, name: &#x27;项目闭环办理&#x27;, status: &#x27;待开始&#x27;, owner: &#x27;成员甲&#x27;, actor: &#x27;成员乙&#x27;, view: &#x27;项目闭环办理页面&#x27; }] }
      ];
      const transitions = [
        [&#x27;S0&#x27;, &#x27;S1&#x27;], [&#x27;S1&#x27;, &#x27;S2&#x27;], [&#x27;S2&#x27;, &#x27;S3&#x27;],
        [&#x27;S3&#x27;, &#x27;S4&#x27;], [&#x27;S4&#x27;, &#x27;S5&#x27;], [&#x27;S5&#x27;, &#x27;S6&#x27;]
      ];
      const taskIndex = new Map();
      const expandedStages = new Set([&#x27;S2&#x27;]);
      const expandedTasks = new Set([&#x27;survey&#x27;]);
      let selected = { kind: &#x27;stage&#x27;, id: &#x27;S2&#x27; };
      const indexTasks = (items, stage, parent) =&gt; items.forEach(task =&gt; {
        taskIndex.set(task.id, { task, stage, parent });
        if (task.children) indexTasks(task.children, stage, task.id);
      });
      stages.forEach(stage =&gt; indexTasks(stage.tasks, stage, null));
      const taskNavigation = items =&gt; items.map(task =&gt;
        &#x27;&lt;div class=&quot;nav-row&quot;&gt;&#x27; +
        (task.children ? &#x27;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-toggle-task=&quot;&#x27; + task.id + &#x27;&quot; aria-label=&quot;展开或收起&#x27; + task.name + &#x27;&quot;&gt;&lt;/button&gt;&#x27; : &#x27;&lt;span class=&quot;nav-spacer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&#x27;) +
        &#x27;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-task=&quot;&#x27; + task.id + &#x27;&quot;&gt;&#x27; + task.name + &#x27;&lt;/button&gt;&lt;/div&gt;&#x27; +
        (task.children ? &#x27;&lt;div class=&quot;task-branch&quot; data-task-children=&quot;&#x27; + task.id + &#x27;&quot;&gt;&#x27; + taskNavigation(task.children) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;)
      ).join(&#x27;&#x27;);
      nav.innerHTML = stages.map(stage =&gt;
        &#x27;&lt;div class=&quot;nav-row&quot;&gt;&#x27; +
        (stage.tasks.length ? &#x27;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-toggle-stage=&quot;&#x27; + stage.id + &#x27;&quot; aria-label=&quot;展开或收起&#x27; + stage.name + &#x27;&quot;&gt;&lt;/button&gt;&#x27; : &#x27;&lt;span class=&quot;nav-spacer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&#x27;) +
        &#x27;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-stage=&quot;&#x27; + stage.id + &#x27;&quot;&gt;&#x27; + stage.id + &#x27; &#x27; + stage.name + &#x27;&lt;/button&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;task-branch&quot; data-stage-children=&quot;&#x27; + stage.id + &#x27;&quot;&gt;&#x27; + taskNavigation(stage.tasks) + &#x27;&lt;/div&gt;&#x27;
      ).join(&#x27;&#x27;);
      const refreshNav = () =&gt; {
        nav.querySelectorAll(&#x27;[data-stage]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(selected.kind === &#x27;stage&#x27; &amp;&amp; selected.id === button.dataset.stage)));
        nav.querySelectorAll(&#x27;[data-task]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(selected.kind === &#x27;task&#x27; &amp;&amp; selected.id === button.dataset.task)));
        nav.querySelectorAll(&#x27;[data-stage-children]&#x27;).forEach(branch =&gt; { branch.hidden = !expandedStages.has(branch.dataset.stageChildren); });
        nav.querySelectorAll(&#x27;[data-task-children]&#x27;).forEach(branch =&gt; { branch.hidden = !expandedTasks.has(branch.dataset.taskChildren); });
        nav.querySelectorAll(&#x27;[data-toggle-stage]&#x27;).forEach(button =&gt; {
          const open = expandedStages.has(button.dataset.toggleStage);
          button.textContent = open ? &#x27;▾&#x27; : &#x27;▸&#x27;; button.setAttribute(&#x27;aria-expanded&#x27;, String(open));
        });
        nav.querySelectorAll(&#x27;[data-toggle-task]&#x27;).forEach(button =&gt; {
          const open = expandedTasks.has(button.dataset.toggleTask);
          button.textContent = open ? &#x27;▾&#x27; : &#x27;▸&#x27;; button.setAttribute(&#x27;aria-expanded&#x27;, String(open));
        });
      };
      const heading = (kind, label) =&gt; &#x27;&lt;div class=&quot;content-heading&quot;&gt;&lt;h3 class=&quot;content-title&quot;&gt;&#x27; + label + &#x27;&lt;/h3&gt;&lt;span class=&quot;text-small mode-label&quot;&gt;&#x27; + kind + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
      const tableRows = (items, level) =&gt; items.map(task =&gt;
        &#x27;&lt;tr data-row-task=&quot;&#x27; + task.id + &#x27;&quot;&gt;&lt;td&gt;&lt;div class=&quot;task-cell&#x27; + (level ? &#x27; task-indent&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;span class=&quot;toggle-slot&quot;&gt;&#x27; + (task.children ? &#x27;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-toggle-task=&quot;&#x27; + task.id + &#x27;&quot; aria-label=&quot;展开或收起&#x27; + task.name + &#x27;&quot; aria-expanded=&quot;&#x27; + expandedTasks.has(task.id) + &#x27;&quot;&gt;&#x27; + (expandedTasks.has(task.id) ? &#x27;▾&#x27; : &#x27;▸&#x27;) + &#x27;&lt;/button&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-task=&quot;&#x27; + task.id + &#x27;&quot;&gt;&#x27; + task.name + &#x27;&lt;/button&gt;&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&#x27; + task.owner + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + task.actor + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + task.status + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27; +
        (task.children &amp;&amp; expandedTasks.has(task.id) ? tableRows(task.children, level + 1) : &#x27;&#x27;)
      ).join(&#x27;&#x27;);
      const stageBusiness = stage =&gt; !stage.workBindingView ? &#x27;&#x27; :
        &#x27;&lt;section aria-label=&quot;阶段业务办理&quot;&gt;&lt;div class=&quot;section-label&quot;&gt;阶段业务办理 · Stage WorkBinding&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;field-value&quot;&gt;&#x27; + stage.workBindingView + &#x27; · 复用原功能&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;viz-controls&quot;&gt;&#x27; +
        &#x27;&lt;label class=&quot;form-label&quot;&gt;计划结束日期&lt;input class=&quot;form-control&quot; readonly value=&quot;工勘要求的项目结束日期&quot;&gt;&lt;/label&gt;&#x27; +
        &#x27;&lt;label class=&quot;form-label&quot;&gt;自然日工期&lt;input class=&quot;form-control&quot; readonly value=&quot;天数&quot;&gt;&lt;/label&gt;&#x27; +
        &#x27;&lt;label class=&quot;form-label&quot;&gt;计划开始日期&lt;input class=&quot;form-control&quot; readonly value=&quot;根据结束日期与工期倒排&quot;&gt;&lt;/label&gt;&#x27; +
        &#x27;&lt;/div&gt;&lt;div class=&quot;viz-row&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;工期维护&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;审批状态&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;版本历史&lt;/button&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;
      const render = () =&gt; {
        refreshNav();
        if (selected.kind === &#x27;stage&#x27;) {
          const stage = stages.find(item =&gt; item.id === selected.id);
          const previous = transitions.filter(edge =&gt; edge[1] === stage.id).map(edge =&gt; edge[0]).join(&#x27;、&#x27;);
          const next = transitions.filter(edge =&gt; edge[0] === stage.id).map(edge =&gt; edge[1]).join(&#x27;、&#x27;);
          content.innerHTML = heading(&#x27;阶段视图&#x27;, stage.id + &#x27; &#x27; + stage.name) +
            &#x27;&lt;div class=&quot;stage-meta text-small&quot;&gt;&lt;span&gt;前置：&#x27; + (previous || &#x27;无&#x27;) + &#x27;&lt;/span&gt;&lt;span&gt;后续：&#x27; + (next || &#x27;收口节点&#x27;) + &#x27;&lt;/span&gt;&lt;span&gt;准入 / 准出：按冻结配置&lt;/span&gt;&lt;/div&gt;&#x27; +
            stageBusiness(stage) +
            &#x27;&lt;div class=&quot;section-label&quot;&gt;阶段任务 · TreeTable&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;&#x27; + stage.name + &#x27;任务树形表格&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;任务层级 / 名称&lt;/th&gt;&lt;th&gt;负责人&lt;/th&gt;&lt;th&gt;执行人&lt;/th&gt;&lt;th&gt;状态&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27; +
            (stage.tasks.length ? tableRows(stage.tasks, 0) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;4&quot;&gt;项目基本管理 · 无交付任务&lt;/td&gt;&lt;/tr&gt;&#x27;) +
            &#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&#x27;;
        } else {
          const { task, stage } = taskIndex.get(selected.id);
          content.innerHTML = heading(&#x27;任务视图 · 直接展示&#x27;, task.name) +
            &#x27;&lt;div class=&quot;text-small text-muted field-value&quot;&gt;&#x27; + stage.id + &#x27; &#x27; + stage.name + &#x27; / &#x27; + task.code + &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;dl class=&quot;meta-list&quot;&gt;&lt;div&gt;&lt;dt&gt;状态&lt;/dt&gt;&lt;dd&gt;&#x27; + task.status + &#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;计划时间&lt;/dt&gt;&lt;dd&gt;开始日期 — 结束日期&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;负责人&lt;/dt&gt;&lt;dd&gt;&#x27; + task.owner + &#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;执行人&lt;/dt&gt;&lt;dd&gt;&#x27; + task.actor + &#x27;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&#x27; +
            &#x27;&lt;div class=&quot;section-label&quot;&gt;任务说明&lt;/div&gt;&lt;div&gt;任务目标、范围与说明的富文本内容&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;section-label&quot;&gt;任务业务办理 · Task WorkBinding&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;field-value&quot;&gt;&#x27; + task.view + &#x27;&lt;/div&gt;&lt;div class=&quot;field-stack&quot;&gt;&#x27; +
            &#x27;&lt;label class=&quot;form-label&quot;&gt;关联业务记录&lt;input class=&quot;form-control&quot; readonly value=&quot;&#x27; + task.name + &#x27; · 示例记录&quot;&gt;&lt;/label&gt;&#x27; +
            &#x27;&lt;label class=&quot;form-label&quot;&gt;原业务内容&lt;textarea class=&quot;form-control&quot; rows=&quot;2&quot; readonly&gt;复用对应业务页面的字段、表单和操作区域&lt;/textarea&gt;&lt;/label&gt;&#x27; +
            &#x27;&lt;div class=&quot;text-small&quot;&gt;原业务页面操作区&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;section-label&quot;&gt;交付件与完成依据&lt;/div&gt;&lt;div class=&quot;text-small&quot;&gt;冻结要求 / 来源业务记录 / 满足情况&lt;/div&gt;&#x27;;
        }
      };
      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;button&#x27;);
        if (!button || !root.contains(button)) return;
        if (button.dataset.toggleStage) {
          const id = button.dataset.toggleStage;
          expandedStages.has(id) ? expandedStages.delete(id) : expandedStages.add(id);
          refreshNav(); return;
        }
        if (button.dataset.toggleTask) {
          const id = button.dataset.toggleTask;
          expandedTasks.has(id) ? expandedTasks.delete(id) : expandedTasks.add(id);
          refreshNav();
          if (selected.kind === &#x27;stage&#x27;) render();
          return;
        }
        if (button.dataset.stage) {
          selected = { kind: &#x27;stage&#x27;, id: button.dataset.stage };
          expandedStages.add(selected.id); render(); return;
        }
        if (button.dataset.task) {
          selected = { kind: &#x27;task&#x27;, id: button.dataset.task };
          const entry = taskIndex.get(selected.id);
          expandedStages.add(entry.stage.id);
          if (entry.parent) expandedTasks.add(entry.parent);
          render();
        }
      });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
