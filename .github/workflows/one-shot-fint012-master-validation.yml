name: One-shot F-INT-012 master validation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-fint012-master-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile affected reactor
        shell: bash
        run: |
          mvn -B -ntp \
            -pl pms-module-integration/pms-module-integration-api,pms-module-platform \
            -am -DskipTests package

      - name: Run focused F-INT-012 tests
        shell: bash
        run: |
          mvn -B -ntp \
            -pl pms-module-platform \
            -am \
            -DskipITs=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=CollectionTaskStateMachineTest,CollectionTaskServiceTest,CollectionCallbackServiceTest,CollectionCredentialConfigurationTest,CredentialTokenServiceTest,DeviceCredentialServiceTest,TemporaryCollectionDispatchServiceTest,DeviceCredentialControllerContractTest \
            test

      - name: Verify traceability remains reproducible
        shell: bash
        run: |
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            --check
          git diff --check

      - name: Record validation and remove one-shot workflow
        shell: bash
        run: |
          mkdir -p docs/evidence
          cat > docs/evidence/f-int-012-master-validation-2026-09-03.md <<EOF
          # F-INT-012 master选择性接收验证

          > 验证状态：\`PASS\`
          > 验证基线：\`master@$(git rev-parse HEAD)\`
          > 验证日期：\`2026-09-03\`
          > Feature状态：\`IN_PROGRESS\`

          ## 已通过

          - Java 25受影响Maven reactor编译：\`pms-module-integration-api,pms-module-platform -am -DskipTests package\`；
          - F-INT-012聚焦单元与Controller合同测试；
          - Requirement追溯只读重建校验；
          - \`git diff --check\`。

          ## 未包含

          - 真实MySQL、Redis、Device Ops HTTP/multipart、并发故障恢复和浏览器闭环；
          - INT边缘接入、Receipt、生产Gateway、文件流转和消费方端到端验证；
          - Implementation Done、SIT、UAT、Deployment或Release结论。

          本证据只证明已接收代码在当前master可编译并通过聚焦测试；Feature继续保持\`IN_PROGRESS\`。
          EOF
          rm .github/workflows/one-shot-fint012-master-validation.yml

      - name: Commit validation evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/f-int-012-master-validation-2026-09-03.md \
                  .github/workflows/one-shot-fint012-master-validation.yml
          git commit -m 'test(f-int-012): 记录master编译与聚焦测试通过'
          git push origin HEAD:master
