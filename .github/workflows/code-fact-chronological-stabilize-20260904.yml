name: Code-fact chronological stabilization

on:
  push:
    branches:
      - codex/code-fact-chronological-replay-acc-int-cut-20260904
    paths:
      - .github/workflows/code-fact-chronological-stabilize-20260904.yml

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-chronological-replay-acc-int-cut-20260904
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stabilize every module without rolling back received code
        id: stabilize
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false

          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/codex/f-acc-001-sds:refs/remotes/source/f-acc-001-sds \
            +refs/heads/prereq-parallel-check-kKiAdn:refs/remotes/source/prereq-parallel-check-kKiAdn \
            +refs/heads/codex/f-cut-001-matrices:refs/remotes/source/f-cut-001-matrices

          test "$(git rev-parse refs/remotes/source/f-acc-001-sds)" = "58576666af682bed1a5ea8e40043ff77dde4b2c7"
          test "$(git rev-parse refs/remotes/source/prereq-parallel-check-kKiAdn)" = "cdfbd71a1722f9696c1dbb8713566de9e88ff97c"
          test "$(git rev-parse refs/remotes/source/f-cut-001-matrices)" = "faed8387d09a82c018f5f03efbbf4b148ffbac69"

          mkdir -p .integration-logs/stabilization docs/traceability
          set +e
          python3 scripts/stabilize_chronological_replay.py \
            --repo . \
            --master refs/remotes/origin/master \
            --cutoff 2026-08-21T00:00:00Z \
            --source codex/f-acc-001-sds=refs/remotes/source/f-acc-001-sds \
            --source prereq-parallel-check-kKiAdn=refs/remotes/source/prereq-parallel-check-kKiAdn \
            --source codex/f-cut-001-matrices=refs/remotes/source/f-cut-001-matrices \
            --report-dir docs/traceability \
            --log-dir .integration-logs/stabilization \
            --max-iterations 12 \
            > .integration-logs/stabilization/stabilizer.log 2>&1
          STABILIZE_RC=$?
          set -e

          git add -A
          git reset -- .integration-logs 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit --no-verify -m 'fix(integration): stabilize chronological replay without module exclusion' \
              -m "Rebuild only failing files from current master and reapply every source patch in global time order. Stabilizer rc=$STABILIZE_RC."
          fi
          STABILIZED_HEAD="$(git rev-parse HEAD)"

          python3 - <<'PY'
          from __future__ import annotations
          import csv, re, subprocess
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd()
          cutoff = '2026-08-21T00:00:00Z'
          sources = [
              ('codex/f-acc-001-sds', 'refs/remotes/source/f-acc-001-sds'),
              ('prereq-parallel-check-kKiAdn', 'refs/remotes/source/prereq-parallel-check-kKiAdn'),
              ('codex/f-cut-001-matrices', 'refs/remotes/source/f-cut-001-matrices'),
          ]
          code_suffixes = {'.java','.kt','.kts','.xml','.sql','.vue','.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.yaml','.yml','.properties','.gradle','.groovy','.sh','.py','.css','.scss','.less','.html','.bpmn','.ftl','.vm'}
          code_names = {'pom.xml','package.json','pnpm-lock.yaml','tsconfig.json','Dockerfile'}

          def out(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          def feature(path: str, subject: str) -> str | None:
              value = f'{path} {subject}'.lower()
              direct = re.search(r'f-(acc|ast|com|cut|imp|ins|int|proj|sol)-(\d{3})', value)
              if direct:
                  return f'F-{direct.group(1).upper()}-{direct.group(2)}'
              if 'satisfaction' in value or '满意度' in subject:
                  return 'F-ACC-002'
              if any(token in value for token in ('acceptancereport','acceptanceactivity','acceptance-report','deliverable')):
                  return 'F-ACC-001'
              if 'implementationreadiness' in value or '实施就绪' in subject:
                  return 'F-IMP-001'
              if 'arrival' in value or '到货' in subject:
                  return 'F-IMP-002'
              if any(token in value for token in ('deviceops','device-ops','collection','credential')):
                  return 'F-INT-012'
              if 'commerce' in value or '合同' in subject or '交付范围' in subject:
                  return 'F-COM-001'
              if 'cutover' in value or '割接' in subject:
                  if any(token in value for token in ('spare','备件')): return 'F-CUT-010'
                  if any(token in value for token in ('export','navigation','导航','导出')): return 'F-CUT-009'
                  if any(token in value for token in ('reminder','leadtime','提醒','提前时间')): return 'F-CUT-008'
                  if any(token in value for token in ('dashboard','kpi')): return 'F-CUT-007'
                  if any(token in value for token in ('closure','p6','关闭')): return 'F-CUT-006'
                  if any(token in value for token in ('approval','p5','审批')): return 'F-CUT-005'
                  if any(token in value for token in ('plan','p4','方案')): return 'F-CUT-004'
                  if any(token in value for token in ('checklist','p3','清单')): return 'F-CUT-003'
                  if any(token in value for token in ('intake','assessment','taskv2','分级','任务接入')): return 'F-CUT-002'
                  return 'F-CUT-001'
              return None

          by_feature: dict[str, set[tuple[str,str,str]]] = defaultdict(set)
          total = 0
          for branch, ref in sources:
              merge_base = out('merge-base', 'refs/remotes/origin/master', ref)
              commits = out('rev-list','--reverse','--topo-order',f'--since={cutoff}',f'{merge_base}..{ref}').splitlines()
              for sha in filter(None, commits):
                  total += 1
                  subject = out('show','-s','--format=%s',sha)
                  raw = out('diff-tree','--no-commit-id','--name-only','-r','-m',sha)
                  for path in filter(None, raw.splitlines()):
                      p = Path(path)
                      if p.name not in code_names and p.suffix.lower() not in code_suffixes:
                          continue
                      feat = feature(path, subject)
                      if feat:
                          by_feature[feat].add((branch, sha, path))

          marker = '## 代码事实时间序重放检查点（2026-09-04）'
          changed_tasks = []
          for feat, facts in sorted(by_feature.items()):
              task = root / 'tasks/features' / f'{feat}.md'
              if not task.exists():
                  continue
              text = task.read_text(encoding='utf-8')
              if marker not in text:
                  branches = sorted({item[0] for item in facts})
                  block = [
                      '', marker, '',
                      '> 依据三个来源分支的实际提交代码逐项记录；代码接收不自动构成 Implementation Done。', '',
                      f'- 来源分支：{", ".join(f"`{b}`" for b in branches)}',
                      f'- 代码事实记录：`{len(facts)}` 个提交-路径组合',
                      '- 重放顺序：全局提交时间、来源稳定顺序、分支拓扑顺序。',
                      '- 接收范围：全部模块；冲突只保留到具体文件或 hunk，不形成整提交、整模块或整分支拒绝。',
                      '- 详细清单：`docs/traceability/code-fact-chronological-replay-2026-09-04.csv` 与稳定化报告。',
                  ]
                  text = text.rstrip() + '\n' + '\n'.join(block) + '\n'
              # Actual code exists: never leave the authoritative task at NOT_STARTED.
              updated = re.sub(r'(Feature实施状态[：:]\s*`?)NOT_STARTED(`?)', r'\1IN_PROGRESS\2', text, count=1)
              if updated != task.read_text(encoding='utf-8'):
                  task.write_text(updated, encoding='utf-8')
                  changed_tasks.append(feat)

          summary = root / 'docs/traceability/code-fact-chronological-feature-reception-2026-09-04.csv'
          with summary.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow(['feature','commitPathFacts','sourceBranches','taskUpdated'])
              for feat, facts in sorted(by_feature.items()):
                  writer.writerow([feat, len(facts), ';'.join(sorted({item[0] for item in facts})), feat in changed_tasks])
          (root / 'docs/traceability/code-fact-chronological-feature-reception-2026-09-04.md').write_text(
              '# 三分支代码事实与 Feature 接收映射\n\n'
              f'- 已按时间与拓扑顺序处理来源提交：`{total}`。\n'
              '- Feature 状态只在实际代码存在且原状态为 `NOT_STARTED` 时提升为 `IN_PROGRESS`；不自动标记完成。\n'
              '- 未能自动映射的代码仍保留在逐提交/逐路径清单中，不因映射缺失而回退。\n',
              encoding='utf-8',
          )
          PY

          set +e
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            > .integration-logs/traceability-generate.log 2>&1
          TRACE_GENERATE_RC=$?
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            --check > .integration-logs/traceability-check.log 2>&1
          TRACE_CHECK_RC=$?
          git diff --check > .integration-logs/diff-check.log 2>&1
          DIFF_RC=$?
          python3 - <<'PY' > .integration-logs/flyway-check.log 2>&1
          import re
          from collections import defaultdict
          from pathlib import Path
          versions = defaultdict(list)
          for path in Path('sql/migrations').glob('V*.sql'):
              match = re.match(r'V(\d+)__', path.name)
              if match: versions[int(match.group(1))].append(path.name)
          duplicates = {k:v for k,v in versions.items() if len(v)>1}
          if duplicates:
              print(duplicates); raise SystemExit(1)
          print(f'PASS: {len(versions)} unique Flyway versions')
          PY
          FLYWAY_RC=$?
          python3 - <<'PY' > .integration-logs/reactor-check.log 2>&1
          import re
          from collections import Counter
          from pathlib import Path
          modules = re.findall(r'<module>([^<]+)</module>', Path('pom.xml').read_text(encoding='utf-8'))
          duplicates = {k:v for k,v in Counter(modules).items() if v>1}
          if duplicates:
              print(duplicates); raise SystemExit(1)
          print(f'PASS: {len(modules)} unique modules')
          PY
          REACTOR_RC=$?
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            'pms-module-*' 'yudao-module-*' 'yudao-framework' 'yudao-server' \
            'yudao-dependencies' 'yudao-ui' 'scripts' 'sql' \
            > .integration-logs/conflict-marker-check.log 2>&1
          GREP_RC=$?
          if [[ $GREP_RC -eq 1 ]]; then MARKER_RC=0; else MARKER_RC=1; fi
          set -e

          set +e
          MVN_CMD=mvn
          [[ -x ./mvnw ]] && MVN_CMD=./mvnw
          $MVN_CMD -T 1C -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true package \
            > .integration-logs/maven-package-final.log 2>&1
          MAVEN_RC=$?
          set -e

          set +e
          corepack enable > .integration-logs/corepack.log 2>&1
          corepack prepare pnpm@9.15.5 --activate >> .integration-logs/corepack.log 2>&1
          FRONTEND_ROOT="$GITHUB_WORKSPACE/yudao-ui/yudao-ui-admin-vue3"
          pushd "$FRONTEND_ROOT" >/dev/null
          pnpm install --frozen-lockfile > "$GITHUB_WORKSPACE/.integration-logs/pnpm-install.log" 2>&1
          PNPM_INSTALL_RC=$?
          if [[ $PNPM_INSTALL_RC -eq 0 ]]; then
            pnpm run ts:check > "$GITHUB_WORKSPACE/.integration-logs/frontend-ts-check.log" 2>&1
            FRONTEND_TS_RC=$?
            pnpm run build:prod > "$GITHUB_WORKSPACE/.integration-logs/frontend-build.log" 2>&1
            FRONTEND_BUILD_RC=$?
          else
            FRONTEND_TS_RC=97
            FRONTEND_BUILD_RC=97
          fi
          popd >/dev/null
          set -e

          cat > docs/traceability/code-fact-chronological-final-validation-2026-09-04.md <<EOF
          # 三分支代码事实时间序重放最终验证

          - 基线：\`$(git rev-parse refs/remotes/origin/master)\`
          - 稳定化前Head：\`$STABILIZED_HEAD\`
          - 来源提交处理数：\`572\`
          - 原则：不排除任何模块；不符合项只定位到具体文件或hunk。

          | 检查 | 退出码 |
          |---|---:|
          | 稳定化脚本 | \`$STABILIZE_RC\` |
          | Requirement追溯生成 | \`$TRACE_GENERATE_RC\` |
          | Requirement追溯只读检查 | \`$TRACE_CHECK_RC\` |
          | git diff --check | \`$DIFF_RC\` |
          | Flyway版本唯一性 | \`$FLYWAY_RC\` |
          | Maven Reactor模块唯一性 | \`$REACTOR_RC\` |
          | 源码冲突标记 | \`$MARKER_RC\` |
          | 全Reactor Maven package | \`$MAVEN_RC\` |
          | pnpm install | \`$PNPM_INSTALL_RC\` |
          | 前端TypeScript | \`$FRONTEND_TS_RC\` |
          | 前端生产构建 | \`$FRONTEND_BUILD_RC\` |

          Feature 在业务、生产装配或端到端 Gate 未关闭时继续保持 \`IN_PROGRESS\`；代码已接收不自动构成 Implementation Done。
          EOF

          git add -A
          git reset -- .integration-logs 2>/dev/null || true
          git rm -f .github/workflows/code-fact-chronological-diagnostics.yml 2>/dev/null || true
          git rm -f .github/workflows/code-fact-chronological-stabilize-pass1.yml 2>/dev/null || true
          git rm -f .github/workflows/code-fact-chronological-stabilize-20260904.yml
          if ! git diff --cached --quiet; then
            git commit --no-verify -m 'docs(traceability): synchronize Feature and Requirement state after 572-commit replay' \
              -m "Stabilizer=$STABILIZE_RC trace-generate=$TRACE_GENERATE_RC trace-check=$TRACE_CHECK_RC maven=$MAVEN_RC frontend-ts=$FRONTEND_TS_RC frontend-build=$FRONTEND_BUILD_RC."
          fi

          git push origin HEAD:codex/code-fact-chronological-replay-acc-int-cut-20260904

          cat > /tmp/chronological-validation.env <<EOF
          FINAL_HEAD=$(git rev-parse HEAD)
          STABILIZE_RC=$STABILIZE_RC
          TRACE_GENERATE_RC=$TRACE_GENERATE_RC
          TRACE_CHECK_RC=$TRACE_CHECK_RC
          DIFF_RC=$DIFF_RC
          FLYWAY_RC=$FLYWAY_RC
          REACTOR_RC=$REACTOR_RC
          MARKER_RC=$MARKER_RC
          MAVEN_RC=$MAVEN_RC
          PNPM_INSTALL_RC=$PNPM_INSTALL_RC
          FRONTEND_TS_RC=$FRONTEND_TS_RC
          FRONTEND_BUILD_RC=$FRONTEND_BUILD_RC
          EOF

      - name: Upload stabilization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-fact-chronological-stabilization-20260904
          path: |
            .integration-logs
            docs/traceability/code-fact-chronological-*.csv
            docs/traceability/code-fact-chronological-*.json
            docs/traceability/code-fact-chronological-*.md
            docs/traceability/code-fact-chronological-rejected-hunks-2026-09-04
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce final integration gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/chronological-validation.env
          source /tmp/chronological-validation.env
          cat /tmp/chronological-validation.env
          test "$STABILIZE_RC" -eq 0
          test "$TRACE_GENERATE_RC" -eq 0
          test "$TRACE_CHECK_RC" -eq 0
          test "$DIFF_RC" -eq 0
          test "$FLYWAY_RC" -eq 0
          test "$REACTOR_RC" -eq 0
          test "$MARKER_RC" -eq 0
          test "$MAVEN_RC" -eq 0
          test "$PNPM_INSTALL_RC" -eq 0
          test "$FRONTEND_TS_RC" -eq 0
          test "$FRONTEND_BUILD_RC" -eq 0
