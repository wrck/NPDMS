name: Code-fact adaptation pass 2

on:
  push:
    branches:
      - codex/code-fact-selective-integration-acc-int-cut-20260903
    paths:
      - .github/workflows/code-fact-adaptation-pass2.yml

permissions:
  contents: write

jobs:
  adapt-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-selective-integration-acc-int-cut-20260903
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Keep non-COM receipts and rebuild
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          LOG_DIR="$(mktemp -d)"
          REPORT="docs/traceability/code-fact-three-branch-integration-2026-09-03.md"

          # The ACC branch inherited an earlier COM implementation. Current master owns
          # the later unified COM-A/COM-B model, so restore only this superseded group.
          git checkout origin/master -- pms-module-commerce
          for P in \
            sql/migrations/V204__received_fcom001_contract_order_scope_forward_migration.sql \
            sql/migrations/V209__received_fcom001_contract_order_scope_schema.sql \
            scripts/tests/test_fcom001_v126_migration.py \
            scripts/tests/test_fcom001_v127_migration.py \
            scripts/tests/test_prd_com_acceptance_scope_trigger.py; do
            if git cat-file -e "origin/master:$P" 2>/dev/null; then
              git checkout origin/master -- "$P"
            else
              git rm -f --ignore-unmatch -- "$P" >/dev/null 2>&1 || true
              rm -f -- "$P"
            fi
          done
          for P in scripts/tests/test_fcom001_feature_contract.py; do
            git checkout origin/master -- "$P"
          done

          set +e
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            > "$LOG_DIR/traceability-pass2.log" 2>&1
          TRACE_RC=$?
          set -e

          set +e
          MVN_CMD=mvn; [[ -x ./mvnw ]] && MVN_CMD=./mvnw
          $MVN_CMD -T 1C -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true \
            -pl pms-module-project,pms-module-customer,pms-module-cutover-api,pms-module-cutover,pms-module-engineering-api,pms-module-engineering,pms-module-integration,pms-module-platform,yudao-module-infra \
            -am package > "$LOG_DIR/maven-pass2.log" 2>&1
          MVN_RC=$?
          set -e

          {
            echo
            echo '## 适配Pass 2：隔离已被主干后继实现取代的旧COM组'
            echo
            echo '- 仅恢复 `pms-module-commerce`、两份旧COM重排迁移及对应旧COM专项脚本。'
            echo '- ACC、CUT、IMP、INT、CUS和Infra流式文件代码继续保留。'
            echo "- Requirement追溯生成退出码：\`$TRACE_RC\`"
            echo "- Maven受影响Reactor构建退出码：\`$MVN_RC\`"
            echo
            echo '### Requirement追溯日志'
            echo '```text'; tail -100 "$LOG_DIR/traceability-pass2.log"; echo '```'
            echo
            echo '### Maven日志'
            echo '```text'; tail -260 "$LOG_DIR/maven-pass2.log"; echo '```'
          } >> "$REPORT"

          git add -A
          git rm .github/workflows/code-fact-adaptation-pass2.yml
          git commit -m 'fix(integration): isolate superseded COM model from three-branch receipts' \
            -m "Retain all other file-level receipts; restore only current-master COM owner files. Traceability rc=$TRACE_RC, Maven rc=$MVN_RC."
          git push origin HEAD:codex/code-fact-selective-integration-acc-int-cut-20260903
          echo "TRACE_RC=$TRACE_RC"
          echo "MVN_RC=$MVN_RC"
