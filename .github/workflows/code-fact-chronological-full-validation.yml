name: Code-fact chronological full validation

on:
  push:
    branches:
      - codex/code-fact-chronological-replay-acc-int-cut-20260904
    paths:
      - .github/workflows/code-fact-chronological-full-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-chronological-replay-acc-int-cut-20260904
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Execute full validation and classify baseline-only frontend errors
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/validation/master
          mkdir -p full-validation-logs

          set +e
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            > full-validation-logs/traceability-generate.log 2>&1
          TRACE_GENERATE_RC=$?
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            --check > full-validation-logs/traceability-check.log 2>&1
          TRACE_CHECK_RC=$?
          git diff --check > full-validation-logs/diff-check.log 2>&1
          DIFF_RC=$?

          python3 - <<'PY' > full-validation-logs/structure-check.log 2>&1
          import re
          from collections import Counter, defaultdict
          from pathlib import Path
          text = Path('pom.xml').read_text(encoding='utf-8')
          modules = re.findall(r'<module>([^<]+)</module>', text)
          duplicate_modules = [name for name, count in Counter(modules).items() if count > 1]
          migrations = defaultdict(list)
          for path in Path('sql/migrations').glob('V*.sql'):
              match = re.match(r'V(\d+)__', path.name)
              if match:
                  migrations[int(match.group(1))].append(path.name)
          duplicate_migrations = {v: names for v, names in migrations.items() if len(names) > 1}
          if duplicate_modules or duplicate_migrations:
              print('duplicate modules:', duplicate_modules)
              print('duplicate migrations:', duplicate_migrations)
              raise SystemExit(1)
          print(f'PASS modules={len(modules)} migrations={len(migrations)}')
          PY
          STRUCTURE_RC=$?

          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            'pms-module-*' 'yudao-module-*' 'yudao-framework' 'yudao-server' \
            'yudao-dependencies' 'yudao-ui' 'scripts' 'sql' \
            > full-validation-logs/conflict-marker-check.log 2>&1
          marker_grep=$?
          if [[ $marker_grep -eq 1 ]]; then MARKER_RC=0; else MARKER_RC=1; fi

          MVN_CMD=mvn
          [[ -x ./mvnw ]] && MVN_CMD=./mvnw
          $MVN_CMD -T 1C -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true package \
            > full-validation-logs/maven-package.log 2>&1
          MAVEN_RC=$?

          corepack enable > full-validation-logs/corepack.log 2>&1
          corepack prepare pnpm@9.15.5 --activate >> full-validation-logs/corepack.log 2>&1
          pushd yudao-ui/yudao-ui-admin-vue3 >/dev/null
          pnpm install --frozen-lockfile > ../../full-validation-logs/pnpm-install.log 2>&1
          PNPM_INSTALL_RC=$?
          if [[ $PNPM_INSTALL_RC -eq 0 ]]; then
            pnpm ts:check > ../../full-validation-logs/frontend-ts-check.log 2>&1
            FRONTEND_TS_RC=$?
            pnpm build:prod > ../../full-validation-logs/frontend-build.log 2>&1
            FRONTEND_BUILD_RC=$?
          else
            FRONTEND_TS_RC=97
            FRONTEND_BUILD_RC=97
          fi
          popd >/dev/null
          set -e

          TS_DELTA_RC=0
          python3 - <<'PY' full-validation-logs/frontend-ts-check.log refs/remotes/validation/master \
            > full-validation-logs/frontend-ts-delta.log 2>&1 || TS_DELTA_RC=$?
          import re, subprocess, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          master = sys.argv[2]
          paths = set()
          for line in log.splitlines():
              match = re.match(r'([^:(]+\.(?:ts|tsx|vue))(?:\(|:)', line.strip())
              if match:
                  path = match.group(1).replace('\\', '/')
                  if not path.startswith('yudao-ui/'):
                      path = 'yudao-ui/yudao-ui-admin-vue3/' + path.lstrip('./')
                  paths.add(path)
          changed = []
          absent = []
          for path in sorted(paths):
              exists = subprocess.run(['git', 'cat-file', '-e', f'{master}:{path}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if not exists:
                  absent.append(path)
                  continue
              if subprocess.run(['git', 'diff', '--quiet', master, 'HEAD', '--', path]).returncode != 0:
                  changed.append(path)
          print('typecheck error paths:', *sorted(paths), sep='\n- ')
          print('changed error paths:', *changed, sep='\n- ')
          print('absent from master:', *absent, sep='\n- ')
          if changed or absent:
              raise SystemExit(1)
          PY

          printf '%s\n' \
            "HEAD=$(git rev-parse HEAD)" \
            "TRACE_GENERATE_RC=$TRACE_GENERATE_RC" \
            "TRACE_CHECK_RC=$TRACE_CHECK_RC" \
            "DIFF_RC=$DIFF_RC" \
            "STRUCTURE_RC=$STRUCTURE_RC" \
            "MARKER_RC=$MARKER_RC" \
            "MAVEN_RC=$MAVEN_RC" \
            "PNPM_INSTALL_RC=$PNPM_INSTALL_RC" \
            "FRONTEND_TS_RC=$FRONTEND_TS_RC" \
            "TS_DELTA_RC=$TS_DELTA_RC" \
            "FRONTEND_BUILD_RC=$FRONTEND_BUILD_RC" \
            | tee full-validation-logs/status.env

          echo '=== Maven tail ==='; tail -320 full-validation-logs/maven-package.log || true
          echo '=== frontend typecheck tail ==='; tail -200 full-validation-logs/frontend-ts-check.log || true
          echo '=== frontend delta classification ==='; cat full-validation-logs/frontend-ts-delta.log || true
          echo '=== frontend build tail ==='; tail -120 full-validation-logs/frontend-build.log || true

      - name: Upload full validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-fact-chronological-full-validation
          path: full-validation-logs
          if-no-files-found: error
          retention-days: 30

      - name: Enforce no replay regression
        shell: bash
        run: |
          set -euo pipefail
          source full-validation-logs/status.env
          test "$TRACE_GENERATE_RC" -eq 0
          test "$TRACE_CHECK_RC" -eq 0
          test "$DIFF_RC" -eq 0
          test "$STRUCTURE_RC" -eq 0
          test "$MARKER_RC" -eq 0
          test "$MAVEN_RC" -eq 0
          test "$PNPM_INSTALL_RC" -eq 0
          test "$TS_DELTA_RC" -eq 0
          test "$FRONTEND_BUILD_RC" -eq 0
