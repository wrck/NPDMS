name: Code-fact validation pass 6

on:
  push:
    branches:
      - codex/code-fact-selective-integration-acc-int-cut-20260903
    paths:
      - .github/workflows/code-fact-validation-pass6.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: npdms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-selective-integration-acc-int-cut-20260903
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-admin-vue3/pnpm-lock.yaml

      - name: Validate received backend, migrations, scripts and frontend
        shell: bash
        env:
          NPDMS_MYSQL_PORT: '3306'
          NPDMS_MYSQL_DATABASE: npdms
          NPDMS_DB_USER: root
          NPDMS_DB_PASSWORD: root
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LOG_DIR="$(mktemp -d)"
          MVN_CMD=mvn; [[ -x ./mvnw ]] && MVN_CMD=./mvnw

          run_capture() {
            local name="$1"; shift
            set +e
            "$@" > "$LOG_DIR/$name.log" 2>&1
            local rc=$?
            set -e
            echo "$rc" > "$LOG_DIR/$name.rc"
            return 0
          }

          run_capture commerce_unit "$MVN_CMD" -T 1C \
            -pl pms-module-commerce -am \
            -DskipITs=true -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=FCom001MigrationContractTest,FCom001RelationIdentityMigrationContractTest,CommerceDeliveryScopeCommandMapperContractTest,CommerceDeliveryScopeAuditContractTest,DeviceAndLocationFactAdapterTest \
            test

          run_capture customer_contract "$MVN_CMD" -T 1C \
            -pl pms-module-customer -am \
            -DskipITs=true -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=CustomerServiceLevelFactApiContractTest \
            test

          run_capture cutover_contract "$MVN_CMD" -T 1C \
            -pl pms-module-cutover -am \
            -DskipITs=true -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=Fcut004MigrationContractTest,Fcut005MigrationContractTest,Fcut006MigrationContractTest,Fcut008MigrationContractTest \
            test

          run_capture engineering_contract "$MVN_CMD" -T 1C \
            -pl pms-module-engineering -am \
            -DskipITs=true -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=ImplementationReadinessApiContractTest \
            test

          run_capture platform_unit "$MVN_CMD" -T 1C \
            -pl pms-module-platform -am \
            -DskipITs=true -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=PlatformOutboxDeliveryApiImplTest \
            test

          run_capture python_contract python3 -m unittest discover -s scripts/tests -p 'test_*.py'

          sudo apt-get update -qq > "$LOG_DIR/apt.log" 2>&1
          sudo apt-get install -y -qq default-mysql-client >> "$LOG_DIR/apt.log" 2>&1
          for i in $(seq 1 60); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && break
            sleep 2
          done

          MIG_RC=0
          : > "$LOG_DIR/migrations.log"
          while IFS= read -r file; do
            echo "APPLY $file" >> "$LOG_DIR/migrations.log"
            if ! mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot npdms < "$file" >> "$LOG_DIR/migrations.log" 2>&1; then
              MIG_RC=1
              echo "FAILED $file" >> "$LOG_DIR/migrations.log"
              break
            fi
          done < <(find sql/migrations -maxdepth 1 -type f -name 'V*.sql' | sort -V)
          echo "$MIG_RC" > "$LOG_DIR/migrations.rc"

          if (( MIG_RC == 0 )); then
            run_capture commerce_mysql "$MVN_CMD" -T 1C \
              -pl pms-module-commerce -am \
              -DskipITs=false -Dsurefire.failIfNoSpecifiedTests=false \
              -Dtest=FCom001MigrationMySqlTest,CommerceDeliveryScopeCommandMySqlTest \
              test
            run_capture engineering_mysql "$MVN_CMD" -T 1C \
              -pl pms-module-engineering -am \
              -DskipITs=false -Dsurefire.failIfNoSpecifiedTests=false \
              -Dtest=PreparationMySqlIntegrationTest \
              test
          else
            echo 99 > "$LOG_DIR/commerce_mysql.rc"
            echo 'not run: migration chain failed' > "$LOG_DIR/commerce_mysql.log"
            echo 99 > "$LOG_DIR/engineering_mysql.rc"
            echo 'not run: migration chain failed' > "$LOG_DIR/engineering_mysql.log"
          fi

          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          pushd yudao-ui/yudao-ui-admin-vue3 >/dev/null
          run_capture frontend_install pnpm install --frozen-lockfile
          if [[ "$(cat "$LOG_DIR/frontend_install.rc")" == 0 ]]; then
            run_capture frontend_type pnpm ts:check
            run_capture frontend_test pnpm exec vitest run src/views/pms/cutover/cutover-task/cutoverTaskInteraction.spec.ts
            run_capture frontend_build pnpm build:test
          else
            for n in frontend_type frontend_test frontend_build; do
              echo 99 > "$LOG_DIR/$n.rc"; echo 'not run: pnpm install failed' > "$LOG_DIR/$n.log"
            done
          fi
          popd >/dev/null

          REPORT=docs/traceability/code-fact-three-branch-integration-2026-09-03.md
          {
            echo
            echo '## 适配Pass 6：接收代码专项验证'
            echo
            echo '| 检查 | 退出码 |'
            echo '|---|---:|'
            for n in commerce_unit customer_contract cutover_contract engineering_contract platform_unit python_contract migrations commerce_mysql engineering_mysql frontend_install frontend_type frontend_test frontend_build; do
              echo "| \`$n\` | \`$(cat "$LOG_DIR/$n.rc")\` |"
            done
            for n in commerce_unit customer_contract cutover_contract engineering_contract platform_unit python_contract migrations commerce_mysql engineering_mysql frontend_install frontend_type frontend_test frontend_build; do
              echo
              echo "### $n"
              echo '```text'
              tail -160 "$LOG_DIR/$n.log"
              echo '```'
            done
          } >> "$REPORT"

          git add "$REPORT"
          git rm .github/workflows/code-fact-validation-pass6.yml
          git commit -m 'test(integration): record received-code validation pass 6' \
            -m 'Validate changed backend contracts, MySQL migration chain, focused MySQL tests, Python contracts and frontend type/test/build. Feature statuses remain unchanged.'
          git push origin HEAD:codex/code-fact-selective-integration-acc-int-cut-20260903
          echo "HEAD=$(git rev-parse HEAD)"
