name: PRD revision 016 alignment

on:
  push:
    branches: [docs/prd-v1.8-p0-p1-fixes]
    paths:
      - scripts/refine_prd_revision_016.py
      - .github/workflows/prd-revision-016-alignment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prd-revision-016-alignment
  cancel-in-progress: false

jobs:
  align:
    if: github.repository == 'wrck/NPDMS' && github.ref == 'refs/heads/docs/prd-v1.8-p0-p1-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Refine and verify exact documentation snapshot
        env:
          REPOSITORY: ${{ github.repository }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch docs/prd-v1.8-p0-p1-fixes "https://github.com/${REPOSITORY}.git" repository
          cd repository
          git checkout --detach "$INPUT_SHA"
          test "$(git rev-parse HEAD:docs/baseline/prd-v1.8.md)" = ebd8f115566e0eacb20294f1b261a37f8ff81d12
          python3 scripts/refine_prd_revision_016.py
      - name: Commit documentation and verification results
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd repository
          python3 scripts/validate_prd_revision_016_alignment.py
          git diff --check
          git add -- docs specs scripts 需求
          git -c user.name='NPDMS documentation automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: verify revision 016 consistency and remove one-shot transport'
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          REMOTE_SHA=$(git -c "http.extraHeader=$AUTH_HEADER" ls-remote origin refs/heads/docs/prd-v1.8-p0-p1-fixes | cut -f1)
          test "$REMOTE_SHA" = "$INPUT_SHA"
          git -c "http.extraHeader=$AUTH_HEADER" push origin HEAD:refs/heads/docs/prd-v1.8-p0-p1-fixes
          unset AUTH_HEADER GH_TOKEN
