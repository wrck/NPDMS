name: PRD revision 016 alignment

on:
  push:
    branches: [docs/prd-v1.8-p0-p1-fixes]
    paths:
      - scripts/prd_workbench_contract.py
      - scripts/tests/test_prd_workbench_contract.py
      - .github/workflows/prd-revision-016-alignment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prd-revision-016-alignment
  cancel-in-progress: false

jobs:
  align:
    if: github.repository == 'wrck/NPDMS' && github.ref == 'refs/heads/docs/prd-v1.8-p0-p1-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check current workbench model without granting release approval
        env:
          REPOSITORY: ${{ github.repository }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch docs/prd-v1.8-p0-p1-fixes "https://github.com/${REPOSITORY}.git" repository
          cd repository
          git checkout --detach "$INPUT_SHA"
          test "$(git rev-parse HEAD:docs/baseline/prd-v1.8.md)" = 4b7bd7a4b099e18edb7e5a10c8c27615118c9d7b
          python3 - <<'PY'
          from pathlib import Path
          import ast, re, subprocess, sys
          p=Path('scripts/validate_prd_baseline.py')
          source=p.read_text(encoding='utf-8')
          marker='    binding_kinds = ("TASK_NATIVE", "业务对象", "业务组件", "动态表单", "审批", "组合")\n'
          addition='    if "TemplateStageDefinition" in pm03:\n        from prd_workbench_contract import current_workbench_contract\n        return current_workbench_contract(pm03, pm11, cut01, cut03)\n'
          assert source.count(marker)==1
          if addition not in source: source=source.replace(marker,marker+addition)
          ast.parse(source)
          p.write_text(source,encoding='utf-8')
          prd='docs/baseline/prd-v1.8.md'
          report=Path('docs/engineering/gates/phase-1/prd-revision-016-alignment.md')
          commands=[
              [sys.executable,'-m','unittest','discover','-s','scripts/tests','-p','test_prd_workbench_contract.py','-v'],
              [sys.executable,'-m','unittest','discover','-s','scripts/tests','-p','test_generate_requirement_traceability.py','-v'],
              [sys.executable,'-m','unittest','discover','-s','scripts/tests','-p','test_prd_revision_016_alignment.py','-v'],
              [sys.executable,'scripts/validate_prd_baseline.py','--prd',prd,'--report',str(report),'--expected-version','V1.8','--expected-status','正式基线'],
              [sys.executable,'scripts/validate_prd_semantics.py','--prd',prd],
              [sys.executable,'scripts/validate_prd_revision_016_alignment.py'],
              [sys.executable,'scripts/validate_prd_domain_generation.py','--prd',prd,'--domains','specs/001-project-delivery-platform/domains'],
              [sys.executable,'scripts/generate_requirement_traceability.py','--prd',prd,'--domains','specs/001-project-delivery-platform/domains','--output','docs/traceability/requirement-matrix.md','--check'],
              [sys.executable,'scripts/generate_phase2_contract_map.py','--prd',prd,'--check'],
              ['git','diff','--check'],
          ]
          results=[]
          for command in commands:
              result=subprocess.run(command,text=True,capture_output=True)
              output=result.stdout+result.stderr
              print('>>> '+' '.join(command),flush=True)
              print(output[-12000:],flush=True)
              assert result.returncode==0, 'Check failed: '+' '.join(command)
              summaries=re.findall(r'Ran \d+ tests[^\n]*|SUMMARY:[^\n]*|PASS[^\n]*', output)
              summary='；'.join(summaries[-2:]) or '退出码0'
              results.append((' '.join(command),summary))
          expected={'scripts/validate_prd_baseline.py',str(report)}
          actual=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert actual<=expected, actual
          assert not subprocess.check_output(['git','diff','641538d67d2a6b6705b1b9c04f245c18adaaffe8','--name-only','--','tasks','apps','backend','frontend'])
          lines=['','## 6. 当前基线检查结果（最终）','',
             '本节更新第5节的基线检查器结果。旧检查器固定匹配修订前工作台句式，现按TemplateStageDefinition/TemplateTaskDefinition、阶段与任务主绑定、原生执行、真实领域视图、任意深度、完成守卫、目标准入及权限边界检查；历史模型检查仍保留。新增反向用例证明删除图定义、放宽主绑定、固定树深、通用摘要替代业务、完成绕过及模板越权均被拒绝。没有修改PRD业务规则或清除任何工程Gate。',
             '', '| 检查命令 | 结果 | 摘要 |','|---|---|---|']
          for command,summary in results: lines.append('| `'+command+'` | PASS | '+summary.replace('|','/')+' |')
          lines+=['','PRD、领域生成、追溯生成与文档回归检查通过。第5节Phase 1/2/3全门禁未通过结果仍有效：独立复审、物理/迁移证据和运行验收未完成，不得解读为APPROVED、Implementation Done或Release GO。','']
          report.write_text(report.read_text(encoding='utf-8').rstrip()+'\n'+'\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit final checker and evidence only
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd repository
          git diff --check
          git add -- scripts/validate_prd_baseline.py docs/engineering/gates/phase-1/prd-revision-016-alignment.md
          git -c user.name='NPDMS documentation automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(docs): validate current workbench contract and record baseline pass'
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          REMOTE_SHA=$(git -c "http.extraHeader=$AUTH_HEADER" ls-remote origin refs/heads/docs/prd-v1.8-p0-p1-fixes | cut -f1)
          test "$REMOTE_SHA" = "$INPUT_SHA"
          git -c "http.extraHeader=$AUTH_HEADER" push origin HEAD:refs/heads/docs/prd-v1.8-p0-p1-fixes
          unset AUTH_HEADER GH_TOKEN
