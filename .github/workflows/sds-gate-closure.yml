name: SDS gate closure verification
on:
  push:
    branches: [docs/prd-v1.8-p0-p1-fixes]
    paths: [.github/workflows/sds-gate-closure.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'wrck/NPDMS' && github.ref == 'refs/heads/docs/prd-v1.8-p0-p1-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve immutable Git source history
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch docs/prd-v1.8-p0-p1-fixes https://github.com/wrck/NPDMS.git repository
          cd repository
          git checkout --detach "$INPUT_SHA"
          git cat-file -e a9f8b7c568546839d3d641531f8036bb75889a82^{commit}
          mkdir -p ../gate-input
          git rev-parse HEAD > ../gate-input/source-commit.txt
          git bundle create ../gate-input/repository.bundle --all
      - name: Preserve scoped review inputs
        uses: actions/upload-artifact@v4
        with:
          name: sds-gate-history
          path: gate-input/
          retention-days: 3
