name: SDS gate closure verification
on:
  push:
    branches: [docs/prd-v1.8-p0-p1-fixes]
    paths: [.github/workflows/sds-gate-closure.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'wrck/NPDMS' && github.ref == 'refs/heads/docs/prd-v1.8-p0-p1-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare exact prospective schema inputs
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch docs/prd-v1.8-p0-p1-fixes https://github.com/wrck/NPDMS.git repository
          cd repository
          git checkout --detach "$INPUT_SHA"
          test "$(git rev-parse HEAD:docs/baseline/prd-v1.8.md)" = 4b7bd7a4b099e18edb7e5a10c8c27615118c9d7b
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(Path('scripts/sds-gate-schema-transport.txt').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '3b37c3b6a4a28b79e11d24b523f753e0c3818b6fe02a52799b78b81a5adb4646'
          files = json.loads(raw)
          assert set(files) == {'docs/traceability/sds-revision-016-physical-contract.json', 'specs/001-project-delivery-platform/appendices/sds-revision-016-carriers.mysql.sql', 'scripts/validate_sds_revision_016_mysql.py'}
          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          PY
      - name: Test empty isolated MySQL 8.4 schema and constraints
        env:
          INPUT_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          docker run -d --name sds016-mysql --network none --label npdms.sds-validation=true -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4
          stable=0
          for attempt in $(seq 1 90); do
            mode=$(docker exec sds016-mysql mysql -uroot -N -B -e 'SELECT @@skip_networking;' 2>/dev/null || true)
            if test "$mode" = 0; then stable=$((stable+1)); else stable=0; fi
            if test "$stable" -ge 3; then break; fi
            sleep 2
          done
          test "$stable" -ge 3
          cd repository
          python3 scripts/validate_sds_revision_016_mysql.py --container sds016-mysql --root . --output ../gate-evidence/mysql-schema.json | tee ../gate-evidence/mysql-schema.log
          git diff --stat > ../gate-evidence/input-files.txt
      - name: Preserve actual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sds016-mysql-evidence
          path: gate-evidence/
          retention-days: 3
      - name: Remove isolated test container
        if: always()
        run: docker rm -f sds016-mysql || true
