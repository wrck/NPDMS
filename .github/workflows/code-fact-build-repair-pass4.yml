name: Code-fact build repair pass 4

on:
  push:
    branches:
      - codex/code-fact-selective-integration-acc-int-cut-20260903
    paths:
      - .github/workflows/code-fact-build-repair-pass4.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-selective-integration-acc-int-cut-20260903
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Deduplicate reactor modules and rebuild
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pom.xml')
          text = p.read_text(encoding='utf-8')
          seen = set()
          removed = []
          def repl(m):
              value = m.group(1).strip()
              if value in seen:
                  removed.append(value)
                  return ''
              seen.add(value)
              return m.group(0)
          text = re.sub(r'(?m)^\s*<module>([^<]+)</module>\s*\n?', repl, text)
          p.write_text(text, encoding='utf-8')
          Path('docs/traceability/code-fact-build-repair-pass4.txt').write_text(
              'removed duplicate modules:\n' + '\n'.join(removed) + '\n', encoding='utf-8')
          PY

          git add pom.xml docs/traceability/code-fact-build-repair-pass4.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(build): deduplicate selectively merged reactor modules' \
              -m 'Preserve the first current-master module registration and remove only duplicate declarations introduced by hunk reconciliation.'
          fi

          LOG_DIR="$(mktemp -d)"
          set +e
          MVN_CMD=mvn; [[ -x ./mvnw ]] && MVN_CMD=./mvnw
          $MVN_CMD -T 1C -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true \
            -pl pms-module-project,pms-module-customer,pms-module-cutover-api,pms-module-cutover,pms-module-engineering-api,pms-module-engineering,pms-module-integration,pms-module-platform,yudao-module-infra \
            -am package > "$LOG_DIR/maven.log" 2>&1
          MVN_RC=$?
          set -e

          REPORT=docs/traceability/code-fact-three-branch-integration-2026-09-03.md
          {
            echo
            echo '## 适配Pass 4：Reactor模块去重与重建'
            echo
            echo '- 仅去除根POM中重复的模块登记，不移除任何已接收源码。'
            echo "- Maven受影响Reactor构建退出码：\`$MVN_RC\`"
            echo '```text'
            tail -300 "$LOG_DIR/maven.log"
            echo '```'
          } >> "$REPORT"

          git add "$REPORT"
          git rm .github/workflows/code-fact-build-repair-pass4.yml
          git commit -m 'docs(traceability): record build repair pass 4' \
            -m "Deduplicated reactor modules; Maven rc=$MVN_RC. Feature statuses remain unchanged."
          git push origin HEAD:codex/code-fact-selective-integration-acc-int-cut-20260903
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAVEN_RC=$MVN_RC"
