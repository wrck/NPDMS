name: Code-fact chronological finalization

on:
  push:
    branches:
      - codex/code-fact-chronological-replay-acc-int-cut-20260904
    paths:
      - .github/workflows/code-fact-chronological-finalize-20260904.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TARGET_BRANCH: codex/code-fact-chronological-replay-acc-int-cut-20260904

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-chronological-replay-acc-int-cut-20260904
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stabilize, verify 572 receipts, synchronize Feature and traceability
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false

          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/codex/f-acc-001-sds:refs/remotes/source/f-acc-001-sds \
            +refs/heads/prereq-parallel-check-kKiAdn:refs/remotes/source/prereq-parallel-check-kKiAdn \
            +refs/heads/codex/f-cut-001-matrices:refs/remotes/source/f-cut-001-matrices

          test "$(git rev-parse refs/remotes/source/f-acc-001-sds)" = "58576666af682bed1a5ea8e40043ff77dde4b2c7"
          test "$(git rev-parse refs/remotes/source/prereq-parallel-check-kKiAdn)" = "cdfbd71a1722f9696c1dbb8713566de9e88ff97c"
          test "$(git rev-parse refs/remotes/source/f-cut-001-matrices)" = "faed8387d09a82c018f5f03efbbf4b148ffbac69"

          mkdir -p .integration-logs/finalization docs/traceability
          set +e
          python3 scripts/stabilize_chronological_replay.py \
            --repo . \
            --master refs/remotes/origin/master \
            --cutoff 2026-08-21T00:00:00Z \
            --source codex/f-acc-001-sds=refs/remotes/source/f-acc-001-sds \
            --source prereq-parallel-check-kKiAdn=refs/remotes/source/prereq-parallel-check-kKiAdn \
            --source codex/f-cut-001-matrices=refs/remotes/source/f-cut-001-matrices \
            --report-dir docs/traceability \
            --log-dir .integration-logs/finalization/stabilizer \
            --max-iterations 16 \
            > .integration-logs/finalization/stabilizer.log 2>&1
          STABILIZE_RC=$?
          set -e

          python3 - <<'PY' > .integration-logs/finalization/receipt-check.log 2>&1
          from __future__ import annotations
          import csv, re, subprocess
          from pathlib import Path

          sources = [
              'refs/remotes/source/f-acc-001-sds',
              'refs/remotes/source/prereq-parallel-check-kKiAdn',
              'refs/remotes/source/f-cut-001-matrices',
          ]
          master = 'refs/remotes/origin/master'
          cutoff = '2026-08-21T00:00:00Z'
          expected = []
          seen = set()
          for ref in sources:
              base = subprocess.check_output(['git','merge-base',master,ref], text=True).strip()
              commits = subprocess.check_output(
                  ['git','rev-list','--reverse','--topo-order',f'--since={cutoff}',f'{base}..{ref}'],
                  text=True,
              ).splitlines()
              for sha in commits:
                  if sha and sha not in seen:
                      seen.add(sha); expected.append(sha)
          if len(expected) != 572:
              raise SystemExit(f'expected 572 unique source commits, got {len(expected)}')

          report = Path('docs/traceability/code-fact-chronological-commit-order-2026-09-04.csv')
          if not report.exists():
              raise SystemExit(f'missing {report}')
          text = report.read_text(encoding='utf-8-sig', errors='replace')
          reported = set(re.findall(r'\b[0-9a-f]{40}\b', text))
          missing = [sha for sha in expected if sha not in reported]
          if missing:
              raise SystemExit(f'{len(missing)} source commits missing from chronological report: {missing[:10]}')

          replay_report = Path('docs/traceability/code-fact-chronological-replay-2026-09-04.csv')
          if not replay_report.exists():
              raise SystemExit(f'missing {replay_report}')
          path_rows = sum(1 for _ in replay_report.open(encoding='utf-8-sig', errors='replace')) - 1
          if path_rows <= 0:
              raise SystemExit('replay path report is empty')
          print(f'PASS source_commits={len(expected)} path_decisions={path_rows}')
          PY
          RECEIPT_RC=$?

          python3 - <<'PY'
          from __future__ import annotations
          import csv, re, subprocess
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd()
          sources = [
              ('codex/f-acc-001-sds','refs/remotes/source/f-acc-001-sds'),
              ('prereq-parallel-check-kKiAdn','refs/remotes/source/prereq-parallel-check-kKiAdn'),
              ('codex/f-cut-001-matrices','refs/remotes/source/f-cut-001-matrices'),
          ]
          master='refs/remotes/origin/master'
          cutoff='2026-08-21T00:00:00Z'
          suffixes={'.java','.kt','.kts','.xml','.sql','.vue','.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.yaml','.yml','.properties','.gradle','.groovy','.sh','.py','.css','.scss','.less','.html','.bpmn','.ftl','.vm'}
          names={'pom.xml','package.json','pnpm-lock.yaml','tsconfig.json','Dockerfile'}

          def out(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def map_feature(path, subject):
              value=(path+' '+subject).lower()
              m=re.search(r'f-(acc|ast|com|cut|imp|ins|int|proj|sol)-(\d{3})',value)
              if m:return f'F-{m.group(1).upper()}-{m.group(2)}'
              if 'satisfaction' in value or '满意度' in subject:return 'F-ACC-002'
              if any(x in value for x in ('acceptancereport','acceptanceactivity','acceptance-report','deliverable')):return 'F-ACC-001'
              if 'implementationreadiness' in value or '实施就绪' in subject:return 'F-IMP-001'
              if 'arrival' in value or '到货' in subject:return 'F-IMP-002'
              if any(x in value for x in ('deviceops','device-ops','collection','credential')):return 'F-INT-012'
              if 'commerce' in value or '合同' in subject or '交付范围' in subject:return 'F-COM-001'
              if 'cutover' in value or '割接' in subject:
                  if any(x in value for x in ('spare','备件')):return 'F-CUT-010'
                  if any(x in value for x in ('export','navigation','导航','导出')):return 'F-CUT-009'
                  if any(x in value for x in ('reminder','leadtime','提醒','提前时间')):return 'F-CUT-008'
                  if any(x in value for x in ('dashboard','kpi')):return 'F-CUT-007'
                  if any(x in value for x in ('closure','p6','关闭')):return 'F-CUT-006'
                  if any(x in value for x in ('approval','p5','审批')):return 'F-CUT-005'
                  if any(x in value for x in ('plan','p4','方案')):return 'F-CUT-004'
                  if any(x in value for x in ('checklist','p3','清单')):return 'F-CUT-003'
                  if any(x in value for x in ('intake','assessment','taskv2','分级','任务接入')):return 'F-CUT-002'
                  return 'F-CUT-001'
              if 'asset' in value:return 'F-AST-001'
              if 'project' in value:return 'F-PROJ-008'
              if 'platform' in value:return 'F-PLT-001'
              return 'UNMAPPED'

          facts=defaultdict(set)
          total=0
          for branch,ref in sources:
              base=out('merge-base',master,ref)
              commits=out('rev-list','--reverse','--topo-order',f'--since={cutoff}',f'{base}..{ref}').splitlines()
              for sha in filter(None,commits):
                  total+=1
                  subject=out('show','-s','--format=%s',sha)
                  paths=out('diff-tree','--no-commit-id','--name-only','-r','-m',sha).splitlines()
                  for path in filter(None,paths):
                      p=Path(path)
                      if p.name not in names and p.suffix.lower() not in suffixes:continue
                      facts[map_feature(path,subject)].add((branch,sha,path))

          marker='## 代码事实时间序重放检查点（2026-09-04）'
          changed=[]
          for feature,items in sorted(facts.items()):
              if feature=='UNMAPPED':continue
              task=root/'tasks/features'/f'{feature}.md'
              if not task.exists():continue
              original=task.read_text(encoding='utf-8')
              text=original
              if marker not in text:
                  branches=', '.join(f'`{x}`' for x in sorted({i[0] for i in items}))
                  text=text.rstrip()+f'''\n\n{marker}\n\n> 依据三个来源分支的实际提交代码记录；代码接收不自动构成 Implementation Done。\n\n- 来源分支：{branches}\n- 提交-路径事实：`{len(items)}`\n- 重放方式：572 条来源提交按全局提交时间、来源稳定顺序和分支拓扑逐条生成回执。\n- 接收边界：全部模块进入扫描；不符合项仅保留到具体文件或 hunk。\n- 详细追溯：`docs/traceability/code-fact-chronological-replay-2026-09-04.csv`。\n'''
              text=re.sub(r'(Feature实施状态[：:]\s*`?)NOT_STARTED(`?)',r'\1IN_PROGRESS\2',text,count=1)
              if text!=original:
                  task.write_text(text,encoding='utf-8');changed.append(feature)

          csv_path=root/'docs/traceability/code-fact-chronological-feature-reception-2026-09-04.csv'
          with csv_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f);w.writerow(['feature','commitPathFacts','branches','taskUpdated'])
              for feature,items in sorted(facts.items()):
                  w.writerow([feature,len(items),';'.join(sorted({i[0] for i in items})),feature in changed])
          md=root/'docs/traceability/code-fact-chronological-feature-reception-2026-09-04.md'
          md.write_text(
              '# 三分支时间序代码事实与 Feature 接收映射\n\n'
              f'- 来源提交：`{total}`。\n'
              '- 全部模块均进入提交/路径扫描。\n'
              '- 只有实际代码存在且原状态为 `NOT_STARTED` 的 Feature 才调整为 `IN_PROGRESS`；未关闭 Gate 的 Feature 不标记完成。\n'
              '- 未自动映射路径仍保留在逐路径清单中，不因此被排除。\n',encoding='utf-8')
          PY

          set +e
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            > .integration-logs/finalization/trace-generate.log 2>&1
          TRACE_GENERATE_RC=$?
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            --check > .integration-logs/finalization/trace-check.log 2>&1
          TRACE_CHECK_RC=$?
          git diff --check > .integration-logs/finalization/diff-check.log 2>&1
          DIFF_RC=$?
          python3 - <<'PY' > .integration-logs/finalization/flyway-check.log 2>&1
          import re
          from collections import defaultdict
          from pathlib import Path
          versions=defaultdict(list)
          for p in Path('sql/migrations').glob('V*.sql'):
              m=re.match(r'V(\d+)__',p.name)
              if m:versions[int(m.group(1))].append(p.name)
          bad={k:v for k,v in versions.items() if len(v)>1}
          if bad:print(bad);raise SystemExit(1)
          print(f'PASS {len(versions)} unique versions')
          PY
          FLYWAY_RC=$?
          python3 - <<'PY' > .integration-logs/finalization/reactor-check.log 2>&1
          import re
          from collections import Counter
          from pathlib import Path
          modules=re.findall(r'<module>([^<]+)</module>',Path('pom.xml').read_text(encoding='utf-8'))
          bad={k:v for k,v in Counter(modules).items() if v>1}
          if bad:print(bad);raise SystemExit(1)
          print(f'PASS {len(modules)} unique modules')
          PY
          REACTOR_RC=$?
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            'pms-module-*' 'yudao-module-*' 'yudao-framework' 'yudao-server' \
            'yudao-dependencies' 'yudao-ui' 'scripts' 'sql' \
            > .integration-logs/finalization/conflict-marker-check.log 2>&1
          GREP_RC=$?
          if [[ $GREP_RC -eq 1 ]];then MARKER_RC=0;else MARKER_RC=1;fi
          set -e

          set +e
          MVN_CMD=mvn;[[ -x ./mvnw ]]&&MVN_CMD=./mvnw
          $MVN_CMD -T 1C -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true package \
            > .integration-logs/finalization/maven-package.log 2>&1
          MAVEN_RC=$?
          set -e

          set +e
          corepack enable > .integration-logs/finalization/corepack.log 2>&1
          corepack prepare pnpm@9.15.5 --activate >> .integration-logs/finalization/corepack.log 2>&1
          pushd yudao-ui/yudao-ui-admin-vue3 >/dev/null
          pnpm install --frozen-lockfile > "$GITHUB_WORKSPACE/.integration-logs/finalization/pnpm-install.log" 2>&1
          PNPM_INSTALL_RC=$?
          if [[ $PNPM_INSTALL_RC -eq 0 ]];then
            pnpm run ts:check > "$GITHUB_WORKSPACE/.integration-logs/finalization/frontend-ts.log" 2>&1
            FRONTEND_TS_RC=$?
            pnpm run build:prod > "$GITHUB_WORKSPACE/.integration-logs/finalization/frontend-build.log" 2>&1
            FRONTEND_BUILD_RC=$?
          else
            FRONTEND_TS_RC=97;FRONTEND_BUILD_RC=97
          fi
          popd >/dev/null
          set -e

          cat > docs/traceability/code-fact-chronological-final-validation-2026-09-04.md <<EOF
          # 三分支时间序逐提交重放最终验证

          - master基线：\`$(git rev-parse refs/remotes/origin/master)\`
          - 来源提交：\`572\`
          - 原则：不排除任何模块；冲突只定位到具体文件或 hunk。

          | 检查 | 退出码 |
          |---|---:|
          | 稳定化 | \`$STABILIZE_RC\` |
          | 572条提交回执覆盖 | \`$RECEIPT_RC\` |
          | Requirement追溯生成 | \`$TRACE_GENERATE_RC\` |
          | Requirement追溯只读检查 | \`$TRACE_CHECK_RC\` |
          | git diff --check | \`$DIFF_RC\` |
          | Flyway版本唯一性 | \`$FLYWAY_RC\` |
          | Reactor模块唯一性 | \`$REACTOR_RC\` |
          | 冲突标记 | \`$MARKER_RC\` |
          | 全Reactor Maven package | \`$MAVEN_RC\` |
          | pnpm install | \`$PNPM_INSTALL_RC\` |
          | 前端TypeScript | \`$FRONTEND_TS_RC\` |
          | 前端生产构建 | \`$FRONTEND_BUILD_RC\` |

          Feature 在业务或端到端 Gate 未关闭时继续为 \`IN_PROGRESS\`，不因代码接收倒签完成。
          EOF

          git add -A
          git reset -- .integration-logs 2>/dev/null || true
          for file in \
            .github/workflows/code-fact-chronological-diagnostics.yml \
            .github/workflows/code-fact-chronological-stabilize-pass1.yml \
            .github/workflows/code-fact-chronological-stabilize-20260904.yml \
            .github/workflows/code-fact-chronological-finalize-20260904.yml; do
            git rm -f "$file" 2>/dev/null || true
          done
          if ! git diff --cached --quiet;then
            git commit --no-verify -m 'docs(traceability): finalize 572-commit chronological code reception' \
              -m "stabilize=$STABILIZE_RC receipts=$RECEIPT_RC trace=$TRACE_GENERATE_RC/$TRACE_CHECK_RC maven=$MAVEN_RC frontend=$PNPM_INSTALL_RC/$FRONTEND_TS_RC/$FRONTEND_BUILD_RC"
          fi
          git push origin HEAD:"$TARGET_BRANCH"

          cat > /tmp/final.env <<EOF
          FINAL_HEAD=$(git rev-parse HEAD)
          STABILIZE_RC=$STABILIZE_RC
          RECEIPT_RC=$RECEIPT_RC
          TRACE_GENERATE_RC=$TRACE_GENERATE_RC
          TRACE_CHECK_RC=$TRACE_CHECK_RC
          DIFF_RC=$DIFF_RC
          FLYWAY_RC=$FLYWAY_RC
          REACTOR_RC=$REACTOR_RC
          MARKER_RC=$MARKER_RC
          MAVEN_RC=$MAVEN_RC
          PNPM_INSTALL_RC=$PNPM_INSTALL_RC
          FRONTEND_TS_RC=$FRONTEND_TS_RC
          FRONTEND_BUILD_RC=$FRONTEND_BUILD_RC
          EOF

      - name: Upload complete finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-fact-chronological-finalization-20260904
          path: |
            .integration-logs/finalization
            docs/traceability/code-fact-chronological-*.csv
            docs/traceability/code-fact-chronological-*.json
            docs/traceability/code-fact-chronological-*.md
            docs/traceability/code-fact-chronological-rejected-hunks-2026-09-04
          if-no-files-found: warn
          retention-days: 30

      - name: Create and merge PR only when every gate is green
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/final.env
          source /tmp/final.env
          cat /tmp/final.env
          test "$STABILIZE_RC" -eq 0
          test "$RECEIPT_RC" -eq 0
          test "$TRACE_GENERATE_RC" -eq 0
          test "$TRACE_CHECK_RC" -eq 0
          test "$DIFF_RC" -eq 0
          test "$FLYWAY_RC" -eq 0
          test "$REACTOR_RC" -eq 0
          test "$MARKER_RC" -eq 0
          test "$MAVEN_RC" -eq 0
          test "$PNPM_INSTALL_RC" -eq 0
          test "$FRONTEND_TS_RC" -eq 0
          test "$FRONTEND_BUILD_RC" -eq 0

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]];then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --head "$TARGET_BRANCH" --base master \
              --title 'feat(integration): 按时间逐条接收 ACC/INT/CUT 三分支代码事实' \
              --body '逐条处理 572 个来源提交；不排除任何模块；冲突仅定位到具体文件或 hunk。已更新 Feature 接收检查点与 Requirement 追溯，并通过完整构建、前端和结构门禁。'
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch=false
          git fetch origin master
          git merge-base --is-ancestor "$FINAL_HEAD" origin/master
          echo "MERGED_PR=$PR_NUMBER"
          echo "MASTER_HEAD=$(git rev-parse origin/master)"
