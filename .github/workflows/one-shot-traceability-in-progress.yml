name: One-shot traceability in-progress alignment

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-traceability-in-progress.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Align Feature index and implementation status derivation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('scripts/generate_requirement_traceability.py')
          text = generator.read_text(encoding='utf-8')

          old_function = '''def derived_status(mappings: list[dict[str, str]]) -> str:
              completed = [item for item in mappings if item["task_status"] == "COMPLETE"]
              if any(item["coverage"] == "FULL" for item in completed):
                  return "IMPLEMENTATION_COMPLETE"
              if completed:
                  return "IMPLEMENTATION_PARTIAL"
              return "NOT_STARTED"
          '''
          new_function = '''def derived_status(mappings: list[dict[str, str]]) -> str:
              completed = [item for item in mappings if item["task_status"] == "COMPLETE"]
              if any(item["coverage"] == "FULL" for item in completed):
                  return "IMPLEMENTATION_COMPLETE"
              if completed:
                  return "IMPLEMENTATION_PARTIAL"
              if any(item["task_status"] == "IN_PROGRESS" for item in mappings):
                  return "IMPLEMENTATION_IN_PROGRESS"
              return "NOT_STARTED"
          '''
          old_function = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_function.splitlines()) + '\n'
          new_function = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_function.splitlines()) + '\n'
          if old_function not in text:
              raise SystemExit('derived_status block not found or already changed unexpectedly')
          text = text.replace(old_function, new_function, 1)

          old_rule = '            "No completed authoritative task mapping => NOT_STARTED",\n'
          new_rule = (
              '            "In-progress authoritative task mapping => IMPLEMENTATION_IN_PROGRESS",\n'
              '            "No completed or in-progress authoritative task mapping => NOT_STARTED",\n'
          )
          if old_rule not in text:
              raise SystemExit('derivation rule marker not found')
          text = text.replace(old_rule, new_rule, 1)

          old_status_rows = (
              '        "| `IMPLEMENTATION_PARTIAL` | 至少一个合法Feature子闭环已完成，但该Requirement目标版本切片仍有未完成或未映射业务义务 |",\n'
              '        "| `NOT_STARTED` | 没有已完成的权威Feature任务覆盖；可包含未启动Feature、缺任务记录的Feature或尚未声明覆盖的切片，不代表需求缺失 |",\n'
          )
          new_status_rows = (
              '        "| `IMPLEMENTATION_PARTIAL` | 至少一个合法Feature子闭环已完成，但该Requirement目标版本切片仍有未完成或未映射业务义务 |",\n'
              '        "| `IMPLEMENTATION_IN_PROGRESS` | 已有合法Feature覆盖且权威Task正在实施；可包含已进入master的部分代码，但尚未达到完成Gate |",\n'
              '        "| `NOT_STARTED` | 没有已完成或进行中的权威Feature任务覆盖；可包含缺任务记录的Feature或尚未声明覆盖的切片，不代表需求缺失 |",\n'
          )
          if old_status_rows not in text:
              raise SystemExit('status table marker not found')
          text = text.replace(old_status_rows, new_status_rows, 1)
          generator.write_text(text, encoding='utf-8')

          index = Path('specs/features/README.md')
          lines = index.read_text(encoding='utf-8').splitlines()
          rows = [
              '| [F-IMP-001](F-IMP-001-implementation-readiness-snapshot.md) | 割接上线实施就绪快照 | EXE-06（V1局部） | DRAFT | NOT_READY / NO-GO | IN_PROGRESS（基础支撑已实现；核心就绪快照待实施） |',
              '| [F-IMP-002](F-IMP-002-arrival-acceptance.md) | 到货签收与里程碑事实 | EXE-01（V1） | BASELINE | READY / GO | IN_PROGRESS（Task 1～11已进入master；Task 12生产装配待完成） |',
              '| [F-INT-012](F-INT-012-device-ops-collection-integration.md) | 设备连接与采集平台集成 | INT-12（V1） | BASELINE | READY | IN_PROGRESS（PLT核心已进入master；INT边缘与E2E待完成） |',
          ]
          existing = '\n'.join(lines)
          missing = [row for row in rows if row not in existing]
          if missing:
              try:
                  insert_at = next(i for i, line in enumerate(lines) if line.startswith('| [F-INS-001]('))
              except StopIteration as exc:
                  raise SystemExit('F-INS-001 index row not found') from exc
              lines[insert_at:insert_at] = missing
              index.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/one-shot-traceability-in-progress.yml')
          workflow.unlink()
          PY

      - name: Rebuild and verify Requirement traceability
        shell: bash
        run: |
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json
          python3 scripts/generate_requirement_traceability.py \
            --prd docs/baseline/prd-v1.8.md \
            --domains specs/001-project-delivery-platform/domains \
            --features specs/features \
            --tasks tasks/features \
            --feature-index specs/features/README.md \
            --output docs/traceability/requirement-matrix.md \
            --coverage-output docs/traceability/requirement-version-coverage.json \
            --check
          git diff --check

      - name: Commit generated alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_requirement_traceability.py \
                  specs/features/README.md \
                  docs/traceability/requirement-matrix.md \
                  docs/traceability/requirement-version-coverage.json \
                  .github/workflows/one-shot-traceability-in-progress.yml
          git commit -m 'chore(traceability): 区分进行中与未开始的Requirement切片'
          git push origin HEAD:master
