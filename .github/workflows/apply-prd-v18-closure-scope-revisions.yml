          if text.count('#### 7.3.1 CLO-01 闭环条件校验') != 1 or text.count('#### 7.3.2 CLO-02 项目闭环审批') != 1:
              raise AssertionError('CLO section identity is not unique')

          path.write_text(text, encoding='utf-8')
          print(f'Updated {path}: {len(text)} characters; formal requirements={requirement_count}')
          PY

      - name: Commit PRD revision and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-prd-v18-closure-scope-revisions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/baseline/prd-v1.8.md .github/workflows/apply-prd-v18-closure-scope-revisions.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "docs(prd): clarify closure and contract scope merge"
          git push origin HEAD:docs/prd-v1.8-p0-p1-fixes
