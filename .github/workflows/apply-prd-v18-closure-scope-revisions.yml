name: Apply PRD V1.8 closure and scope revisions

on:
  push:
    branches:
      - docs/prd-v1.8-p0-p1-fixes
    paths:
      - .github/workflows/apply-prd-v18-closure-scope-revisions.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/prd-v1.8-p0-p1-fixes
          fetch-depth: 0

      - name: Apply reviewed PRD revisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('docs/baseline/prd-v1.8.md')
          text = path.read_text(encoding='utf-8')
          current_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          expected_blob = 'ac464a3848e68ee84600e31c12368fa30cb7804c'
          if current_blob != expected_blob:
              raise SystemExit(f'Unexpected PRD blob: {current_blob}; expected {expected_blob}')

          def sub_once(pattern: str, replacement: str, label: str, flags=re.MULTILINE | re.DOTALL):
              global text
              text, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise AssertionError(f'{label}: expected 1 replacement, got {count}')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{label}: expected 1 exact occurrence, got {count}')
              text = text.replace(old, new, 1)

          # Revision record: keep historical rows unchanged and append a new clarification record.
          revision_row = '| V1.8修订014 | 2026-09-03 | 需求方/产品组 | `CHG-PRD-2026-09-03-014`：按业务裁决修正项目闭环与PM-06边界。项目闭环不再强制要求实际进入S6；正常闭环仅校验冻结模板已配置的交付条件，模板不含S5时不要求终验；新增代理商自服“不予跟踪闭环”终态并与正常闭环、异常关闭分开统计，CLO-02唯一产生两类业务闭环终态，PM-10仅产生异常关闭。PM-06改为在同一既有项目内追加合并新合同、订单行和实施范围，形成不可变范围新版本并触发任务、计划、方案、实施、验收及闭环门禁影响重算；不创建新项目或项目组合。不新增或删除正式Requirement，不改变优先级、目标版本及领域Owner。 |'
          if revision_row not in text:
              text, count = re.subn(r'^(\| V1\.8修订012 \|[^\n]*\n)', lambda m: m.group(1) + revision_row + '\n', text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise AssertionError('revision record anchor not found exactly once')

          sub_once(
              r'^\| 生命周期状态码表 \|.*$',
              '| 生命周期状态码表 | `ACTIVE`=进行中、`NORMAL_CLOSED`=正常闭环、`NO_TRACKING_CLOSED`=不予跟踪闭环、`EXCEPTION_CLOSED`=异常关闭（正文首次出现文字表述时附此码表） |',
              'glossary lifecycle status',
              flags=re.MULTILINE,
          )

          s5 = '''### 3.1.6 S5 验收交维

| 项    | 内容 |
| ---- | ---- |
| 阶段目标 | 对冻结模板包含S5的项目完成培训、满意度、按签约方式执行验收并完成交付件归档 |
| 主要活动 | 现场培训推送、满意度调查推送；直签项目初验后终验，非直签项目直接终验；交付件汇总 |
| 输入   | 实施部署产出及冻结模板中的S5任务、交付件和门禁 |
| 输出   | 培训记录、满意度报告、验收报告、交付件包 |
| 完成标准 | 仅当冻结模板包含S5时适用：直签项目完成有效初验和终验，非直签项目完成有效终验；同时满足模板要求的交付件及其他门禁 |

'''
          sub_once(r'^### 3\.1\.6 S5 验收交维\n.*?(?=^### 3\.1\.7 S6 项目闭环\n)', s5, 'S5 lifecycle section')

          s6 = '''### 3.1.7 S6 项目闭环

| 项    | 内容 |
| ---- | ---- |
| 阶段目标 | 当项目模板配置S6时，承载闭环校验、申请和审批工作台；S6不是所有项目闭环的强制前置阶段 |
| 主要活动 | 选择闭环类型、生成CLO-01校验快照、处置阻断对象、执行CLO-02版本化审批并形成闭环记录 |
| 输入   | 闭环前最后一个真实阶段、冻结模板的闭环条件、闭环类型、适用的交付/验收/服务交接事实或不予跟踪依据 |
| 输出   | 闭环校验快照、审批实例、不可变闭环记录、闭环来源阶段和对应生命周期终态 |
| 完成标准 | 正常闭环满足冻结模板实际配置的全部条件；代理商自服不予跟踪闭环满足资格、依据、在途对象处置和审批条件；项目可从模板允许的最后实际阶段发起闭环，不得为闭环补造S5、终验或S6实例 |

'''
          sub_once(r'^### 3\.1\.7 S6 项目闭环\n.*?(?=^### 3\.1\.8 阶段控制点\n)', s6, 'S6 lifecycle section')

          sub_once(
              r'^\| 闭环审核\s*\| S6\s*\|.*$',
              '| 闭环审核      | 模板绑定阶段（通常S6） | CLO-01按闭环类型校验、CLO-02按实际BPM定义审批；闭环不以实际进入S6为统一前置 |',
              'closure control-point row',
              flags=re.MULTILINE,
          )

          sub_once(
              r'^\| 6\s+\| 售前测试场景.*$',
              '| 6  | 售前测试场景        | 借货测试，验证后转销        | S0→S4（仅EXE-03/EXE-04） | 模板仅预设并实例化S0、S4；S4准出后可从S4发起正常闭环，不创建S1/S2/S3/S5/S6实例；转销后实施记录与正式项目建立受控关联或派生副本 |',
              'presales template row',
              flags=re.MULTILINE,
          )

          closure_rule = '''**项目闭环统一规则：** 项目是否可闭环由CLO-01/02与冻结模板的闭环条件决定，不由模板是否配置S6决定。项目可以从冻结关系图允许的最后一个真实`current_stage`发起闭环；闭环后保留该阶段并记录`closed_from_stage`，不得为闭环补造未执行的阶段、任务、终验或交付事实。正常闭环只校验模板实际配置的条件：模板包含S5时必须存在当前有效终验，模板不含S5时不得因缺少终验阻断。项目实施方式为“代理商自服”时，授权用户可显式申请“不予跟踪闭环”，但不得仅凭实施方式自动关闭；该路径不表示实施或验收成功，须单独保存依据、处置在途对象并完成CLO审批。异常退出仍由PM-10处理。

'''
          s5_rule_pattern = r'(^\*\*S5验收统一规则：\*\*[^\n]*\n\n)'
          text, count = re.subn(s5_rule_pattern, lambda m: m.group(1) + closure_rule, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise AssertionError('failed to append unified closure rule')

          text = text.replace(
              '创建→指派→工前准备→计划→方案→实施→验收→闭环（正常闭环；异常退出可进入异常关闭）',
              '创建→指派→按模板执行交付阶段→业务闭环（正常闭环/不予跟踪闭环；异常退出可进入异常关闭）',
              1,
          )

          project_entity = '''#### 3.4.1.1 项目实体

| 字段类别  | 关键字段 |
| ----- | ---- |
| 基础信息  | 项目编码、项目名称、签约方式（直签/非直签）、项目类别（普通/工程）、项目实施方式（原厂直服/原厂督导/代理商自服）、CRM重大项目级别、行业四维 |
| 组织与行业 | 所属办事处、市场部、系统部、拓展部、子行业、销售、服务经理（一级/二级）、项目经理、团队成员、外协工程师 |
| 时间信息  | 创建时间、工期要求、合同验收时间、各阶段计划时间、各阶段实际时间 |
| 合同与范围 | 关联合同集合、销售订单/订单行引用、订单行分配数量、当前项目范围版本、范围变更类型、生效区间及范围差异 |
| 关联信息  | 主项目编码（子项目）、CRM项目编码、CRM执行单号、原项目编码（仅借货转销） |
| 状态信息  | 当前阶段（冻结模板中的S0～S6阶段编码）、生命周期状态（ACTIVE/NORMAL_CLOSED/NO_TRACKING_CLOSED/EXCEPTION_CLOSED）、指派状态（UNASSIGNED/ASSIGNED）、派生统计展示状态、超期标记 |
| 闭环信息  | 闭环类型（NORMAL/NO_TRACKING/EXCEPTION）、闭环来源阶段`closed_from_stage`、闭环快照/审批/记录引用、闭环时间和闭环原因 |

'''
          sub_once(r'^#### 3\.4\.1\.1 项目实体\n.*?(?=^#### 3\.4\.1\.2 )', project_entity, 'project entity fields')

          relation_rows = '''| 项目-原项目（借货转销） | N:1             | 借货临时项目与转销正式项目通过来源/目标关系关联；不用于表达项目内合同及实施范围追加 |
| 项目-合同/订单行实施范围 | 1:N             | 一个项目可承载多份合同及其订单行实施范围；ERP拥有合同订单事实，项目交付域拥有订单行分配、范围版本和生效关系 |
| 项目-项目范围版本      | 1:N             | 每次批准的合同或实施范围追加形成单调递增且不可原位修改的范围版本；历史计划、方案、实施和验收事实不得自动覆盖新增范围 |'''
          sub_once(r'^\| 项目-原项目（借货/多期）.*$', relation_rows, 'project relation rows', flags=re.MULTILINE)

          project_status = '''#### 3.4.3.2 项目状态模型

项目状态采用“阶段、生命周期状态、指派状态、派生展示状态”四层模型，并单独保存闭环类型和闭环来源阶段。禁止使用一个可写`project_status`同时表达阶段、关闭、割接或维护语义。

| 状态维度 | 权威含义 | 允许值/来源 | 写入规则 |
| ---- | ---- | ---- | ---- |
| 当前阶段 `current_stage` | 项目最后一个真实活动的模板阶段实例 | 冻结模板关系图中的S0～S6阶段编码 | 仅由当前阶段准出、有效阶段转移和目标准入共同推进；闭环不得创建虚假S5/S6或把`current_stage`改写为未实际进入的阶段 |
| 生命周期状态 `lifecycle_status` | 项目是否仍处于交付生命周期以及最终退出方式 | `ACTIVE`进行中、`NORMAL_CLOSED`正常闭环、`NO_TRACKING_CLOSED`不予跟踪闭环、`EXCEPTION_CLOSED`异常关闭 | PM-01创建为ACTIVE；CLO-02唯一产生NORMAL_CLOSED或NO_TRACKING_CLOSED；PM-10唯一产生EXCEPTION_CLOSED |
| 指派状态 `assignment_status` | 当前是否同时完成主责服务经理和项目经理指派 | `UNASSIGNED`待指派、`ASSIGNED`已指派 | PM-01/PM-08及受控改派共同维护；不改写生命周期状态 |
| 统计展示状态 `display_status` | 列表、看板和报表使用的可读业务状态 | 由当前阶段、生命周期状态、领域任务事实和超期事实派生 | 只读派生；“割接中”等不得直接改写项目生命周期状态 |
| 闭环类型 `closure_type` | 本次最终退出的业务类别 | `NORMAL`、`NO_TRACKING`、`EXCEPTION` | 与闭环记录同时冻结；不得通过页面字典直接改写 |
| 闭环来源阶段 `closed_from_stage` | 发起并完成闭环前的最后一个真实阶段 | 闭环事务发生时的`current_stage`快照 | CLO-02或PM-10写入终态时保存；闭环后`current_stage`仍保留该真实阶段 |

统一迁移规则：

1. PM-01创建项目时写入`lifecycle_status=ACTIVE`并进入模板开始阶段；主责未完整指派时`assignment_status=UNASSIGNED`。
2. 阶段推进只沿冻结模板关系图执行。模板未配置的阶段不生成实例，也不通过`APPLICABLE/NOT_APPLICABLE`表达。
3. PM-10“回退”后项目仍为ACTIVE；PM-10“异常关闭”写入`EXCEPTION_CLOSED`和`closure_type=EXCEPTION`。
4. 正常闭环可从模板允许的最后实际阶段发起。CLO-01仅校验冻结模板已配置的交付条件；模板包含S5时校验当前有效终验，模板不含S5时不校验终验。CLO-02审批通过后写入`NORMAL_CLOSED`和`closure_type=NORMAL`。
5. 仅当项目实施方式为“代理商自服”且授权用户显式选择、提交不予跟踪依据、处置在途对象并通过CLO审批时，CLO-02写入`NO_TRACKING_CLOSED`和`closure_type=NO_TRACKING`。实施方式本身不得自动触发闭环；该状态不代表实施或验收成功。
6. 业务闭环不强制要求`current_stage=S6`。闭环事务保存`closed_from_stage`，并保留闭环前真实`current_stage`；不得补造S5、终验、S6、任务或交付件完成事实。
7. CUT、INS、采集、转包等领域任务拥有独立状态机，只能通过业务事件刷新项目阶段、进度或派生展示状态，不能直接写项目闭环终态。
8. PM-10只允许按受控规则重开`EXCEPTION_CLOSED`。`NORMAL_CLOSED`和`NO_TRACKING_CLOSED`不得通过PM-10直接重开；继续承载新增实施范围时须走另行批准的重开/范围变更机制或新建项目。
9. RPT-02分别统计正常闭环、不予跟踪闭环和异常关闭。“业务已闭环”可包含前两者；“正常交付闭环率”分子只包含`NORMAL_CLOSED`。

'''
          sub_once(r'^#### 3\.4\.3\.2 项目状态模型\n.*?(?=^#### 3\.4\.3\.3 状态与版本禁止项\n)', project_status, 'project status model')

          sub_once(
              r'^\| 项目闭环快照与最终闭环记录.*$',
              '| 项目闭环快照与最终闭环记录                        | CLO闭环域                 | 项目生命周期状态、项目档案              | 条件失效重新校验/新实例，不沿用失效快照；只有CLO-02可按审批闭环类型产生NORMAL_CLOSED或NO_TRACKING_CLOSED |',
              'owner matrix closure row',
              flags=re.MULTILINE,
          )
          sub_once(
              r'^\| 项目闭环最终通过.*$',
              '| 项目业务闭环审批通过      | CLO-02           | 项目生命周期状态、项目档案、RPT-02 | 按冻结闭环类型写入NORMAL_CLOSED或NO_TRACKING_CLOSED，保存closed_from_stage并分别统计 | 项目+闭环实例+状态版本；重复回调不得二次写终态 |',
              'closure event row',
              flags=re.MULTILINE,
          )

          # PM-01 lifecycle code table.
          text = text.replace(
              '生命周期状态码表：ACTIVE（进行中）/ NORMAL_CLOSED（正常关闭）/ EXCEPTION_CLOSED（异常关闭）。',
              '生命周期状态码表：ACTIVE（进行中）/ NORMAL_CLOSED（正常闭环）/ NO_TRACKING_CLOSED（不予跟踪闭环）/ EXCEPTION_CLOSED（异常关闭）。',
              1,
          )

          pm10 = '''#### 4.2.10 PM-10 项目回退与异常关闭

| 属性 | 内容 |
| ---- | ---- |
| 需求编号 | PM-10 |
| 所属阶段 | S0及项目活动期 |
| 用户角色 | 服务经理、工程管理部 |
| 优先级 | P1 |
| 目标版本 | V1 |
| 复杂度 | 低 |
| 依赖条件 | 内部强前置：项目状态机、在途对象检查和归档规则 |

**业务场景与需求描述：**
PM-10只承载项目责任回退和异常关闭。回退用于将无法继续由当前责任主体承接的活动项目退回重新指派；异常关闭用于项目取消、失效或其他不再实施的异常退出。代理商自服“不予跟踪闭环”属于CLO-01/02管理的合法业务闭环，不得通过PM-10写成异常关闭。

**核心业务规则：**
1. 回退不改变`lifecycle_status=ACTIVE`，按受控规则结束原责任区间、将`assignment_status`置为`UNASSIGNED`并回到允许重新指派的阶段；已有业务事实保持只读可追溯。
2. 异常关闭必须填写原因、业务依据及遗留事项，并在所有在途审批、采集、割接、巡检、转包和其他领域任务按各自Owner规则完成、撤回、终止或明确移交后，才可写入`EXCEPTION_CLOSED`。
3. PM-10不得产生`NORMAL_CLOSED`或`NO_TRACKING_CLOSED`，也不得把“代理商自服”自动解释为异常关闭或不予跟踪闭环。
4. 主项目异常关闭前必须检查全部后代项目；存在未处置后代时禁止关闭。关闭子项目不自动关闭父项目或平级项目。
5. 异常关闭后禁止新增或修改业务数据，仅允许有权人员查看、导出和执行受控重开。PM-10只允许重开`EXCEPTION_CLOSED`；正常闭环和不予跟踪闭环如需继续承载业务，必须使用另行批准的闭环后变更机制或新建项目。

**用户故事：**
作为服务经理，我希望对无法继续由当前责任人承接的项目发起回退，并对取消或失效项目执行异常关闭，使责任调整、业务闭环和异常退出保持清晰边界。

**验收标准：**
- **WHEN** 服务经理对符合条件的活动项目填写原因并确认回退
- **THEN** 平台保持`lifecycle_status=ACTIVE`，结束原责任区间、将`assignment_status`置为`UNASSIGNED`并保留全部历史事实
- **WHEN** 工程管理部对不存在未处置在途对象和后代项目的异常项目确认关闭
- **THEN** 平台保存依据及遗留事项快照，写入`lifecycle_status=EXCEPTION_CLOSED`、`closure_type=EXCEPTION`和`closed_from_stage`，且不计入业务闭环数量
- **WHEN** 项目实施方式为代理商自服且用户希望不再跟踪
- **THEN** PM-10不得直接关闭；平台应引导使用CLO-01/02的不予跟踪闭环路径
- **WHEN** 有权人员通过PM-10重开项目
- **THEN** 仅`EXCEPTION_CLOSED`可以恢复为ACTIVE；`NORMAL_CLOSED`和`NO_TRACKING_CLOSED`均被拒绝

**涉及数据字段：**
