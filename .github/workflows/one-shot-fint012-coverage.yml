name: One-shot F-INT-012 requirement coverage alignment

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-fint012-coverage.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add canonical Requirement slice coverage and remove one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('specs/features/F-INT-012-device-ops-collection-integration.md')
          text = spec.read_text(encoding='utf-8')
          marker = '> Requirement：`INT-12（V1）`\n'
          coverage = '> Requirement切片覆盖：`INT-12@V1=FULL`\n'
          if coverage not in text:
              if marker not in text:
                  raise SystemExit('F-INT-012 Requirement marker not found')
              text = text.replace(marker, marker + coverage, 1)
              spec.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/one-shot-fint012-coverage.yml')
          workflow.unlink()
          PY

      - name: Commit traceability alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/features/F-INT-012-device-ops-collection-integration.md .github/workflows/one-shot-fint012-coverage.yml
          git commit -m 'chore(traceability): 标记F-INT-012覆盖INT-12@V1'
          git push origin HEAD:master
