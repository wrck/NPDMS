name: Code-fact selective integration (ACC / INT / CUT)

on:
  push:
    branches:
      - codex/code-fact-selective-integration-acc-int-cut-20260903
    paths:
      - .github/workflows/code-fact-selective-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/code-fact-selective-integration-acc-int-cut-20260903
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Selectively receive committed code facts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/codex/f-acc-001-sds:refs/remotes/origin/codex/f-acc-001-sds \
            +refs/heads/prereq-parallel-check-kKiAdn:refs/remotes/origin/prereq-parallel-check-kKiAdn \
            +refs/heads/codex/f-cut-001-matrices:refs/remotes/origin/codex/f-cut-001-matrices

          BASE="$(git rev-parse HEAD)"
          LOG_DIR="$(mktemp -d)"
          DECISIONS="$LOG_DIR/decisions.tsv"
          CONFLICTS="$LOG_DIR/conflicts.tsv"
          : > "$DECISIONS"
          : > "$CONFLICTS"

          is_code_path() {
            case "$1" in
              .github/*|docs/*|specs/*|tasks/*|features/*|output/*|prompts/*|.superpowers/*|.run/*|AGENTS.md|CLAUDE.md|README.md|LICENSE)
                return 1 ;;
              *.java|*.kt|*.kts|*.xml|*.sql|*.vue|*.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.json|*.yaml|*.yml|*.properties|*.gradle|*.groovy|*.sh|*.py|*.css|*.scss|*.less|*.html|*.bpmn|*.ftl|*.vm|*/pom.xml|pom.xml|*/package.json|package.json|*/pnpm-lock.yaml|pnpm-lock.yaml|*/tsconfig.json|tsconfig.json|*/Dockerfile|Dockerfile)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          is_duplicate_file_owner() {
            case "$1" in
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/api/file/ArtifactFileApi.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/api/file/dto/ArtifactFileCreateCommand.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/api/file/dto/ArtifactFileVersionDTO.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/dal/dataobject/file/FileArtifactDO.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/dal/dataobject/file/FileVersionDO.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/dal/mysql/file/FileArtifactMapper.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/dal/mysql/file/FileVersionMapper.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/service/file/ArtifactFileApiImpl.java|\
              yudao-module-infra/src/main/java/cn/iocoder/yudao/module/infra/service/file/ArtifactFileService.java|\
              yudao-module-infra/src/test/java/cn/iocoder/yudao/module/infra/service/file/ArtifactFileServiceTest.java)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          restore_head_path() {
            local f="$1"
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout HEAD -- "$f"
            else
              rm -rf -- "$f"
              git rm -r --cached --ignore-unmatch -- "$f" >/dev/null 2>&1 || true
            fi
          }

          max_migration_version() {
            git ls-tree -r --name-only HEAD sql/migrations 2>/dev/null \
              | sed -n 's#^sql/migrations/V\([0-9][0-9]*\)__.*#\1#p' \
              | sort -n | tail -1 | awk '{print ($0=="" ? 0 : $0)}'
          }

          normalize_new_migrations() {
            local branch="$1" commit="$2"
            while IFS=$'\t' read -r status f; do
              [[ "$status" == "A" ]] || continue
              [[ "$f" =~ ^sql/migrations/V([0-9]+)__(.+)\.sql$ ]] || continue
              local version="${BASH_REMATCH[1]}" slug="${BASH_REMATCH[2]}"
              local maxv
              maxv="$(max_migration_version)"
              if (( version > maxv )); then
                continue
              fi

              local hash duplicate=""
              hash="$(sha256sum "$f" | awk '{print $1}')"
              while IFS= read -r existing; do
                [[ "$existing" == "$f" ]] && continue
                if [[ "$(sha256sum "$existing" | awk '{print $1}')" == "$hash" ]]; then
                  duplicate="$existing"
                  break
                fi
              done < <(find sql/migrations -maxdepth 1 -type f -name 'V*.sql' | sort)
              if [[ -n "$duplicate" ]]; then
                git rm -f -- "$f" >/dev/null
                printf '%s\t%s\t%s\t%s\t%s\n' "$branch" "$commit" "$f" "NOOP_MIGRATION_EXACT" "$duplicate" >> "$DECISIONS"
                continue
              fi

              mapfile -t created < <(grep -Eio 'CREATE[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+NOT[[:space:]]+EXISTS[[:space:]]+)?`?[A-Za-z0-9_]+' "$f" \
                | sed -E 's/.*`?([A-Za-z0-9_]+)$/\1/I' | sort -u)
              local overlap=0 table
              for table in "${created[@]:-}"; do
                [[ -n "$table" ]] || continue
                if grep -RiqE "CREATE[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+NOT[[:space:]]+EXISTS[[:space:]]+)?\x60?${table}\x60?" sql/migrations --exclude="$(basename "$f")"; then
                  overlap=1
                  break
                fi
              done
              if (( ${#created[@]} == 0 || overlap == 1 )); then
                git rm -f -- "$f" >/dev/null
                printf '%s\t%s\t%s\t%s\t%s\n' "$branch" "$commit" "$f" "MIGRATION_ADAPT_REQUIRED" "old version or mixed/existing table owner" >> "$CONFLICTS"
                continue
              fi

              local next=$((maxv + 1)) target="sql/migrations/V$((maxv + 1))__received_${slug}.sql"
              git mv -- "$f" "$target"
              {
                echo "-- Selectively received from $branch@$commit ($f)."
                echo "-- Renumbered after current master migration chain; Feature remains IN_PROGRESS."
                echo
                cat "$target"
              } > "$target.tmp"
              mv "$target.tmp" "$target"
              git add "$target"
              printf '%s\t%s\t%s\t%s\t%s\n' "$branch" "$commit" "$target" "APPLIED_MIGRATION_RENUMBERED" "V$version -> V$next" >> "$DECISIONS"
            done < <(git diff --cached --name-status --diff-filter=A)
          }

          for BRANCH in codex/f-acc-001-sds prereq-parallel-check-kKiAdn codex/f-cut-001-matrices; do
            REF="origin/$BRANCH"
            MERGE_BASE="$(git merge-base "$BASE" "$REF")"
            mapfile -t COMMITS < <(git rev-list --reverse --topo-order --since='2026-08-21T00:00:00Z' "$MERGE_BASE..$REF")
            echo "Processing $BRANCH: ${#COMMITS[@]} commits"

            for COMMIT in "${COMMITS[@]}"; do
              git reset --hard HEAD >/dev/null
              git clean -fd >/dev/null
              SUBJECT="$(git show -s --format=%s "$COMMIT")"
              PARENT_COUNT="$(git show -s --format=%P "$COMMIT" | awk '{print NF}')"
              set +e
              if (( PARENT_COUNT > 1 )); then
                git cherry-pick -n -m 1 "$COMMIT" >/tmp/cherry.out 2>/tmp/cherry.err
              else
                git cherry-pick -n "$COMMIT" >/tmp/cherry.out 2>/tmp/cherry.err
              fi
              CHERRY_RC=$?
              set -e

              mapfile -t ALL_PATHS < <({
                git diff --name-only --cached
                git diff --name-only
                git diff --name-only --diff-filter=U
              } | sort -u)

              for F in "${ALL_PATHS[@]:-}"; do
                [[ -n "$F" ]] || continue
                if ! is_code_path "$F"; then
                  restore_head_path "$F"
                  printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "EXCLUDED_NON_CODE" "$SUBJECT" >> "$DECISIONS"
                fi
              done

              mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U)
              for F in "${UNMERGED[@]:-}"; do
                [[ -n "$F" ]] || continue
                if ! is_code_path "$F"; then
                  restore_head_path "$F"
                  continue
                fi
                if is_duplicate_file_owner "$F"; then
                  restore_head_path "$F"
                  git add -A -- "$F" 2>/dev/null || true
                  printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "EXCLUDED_DUPLICATE_OWNER" "$SUBJECT" >> "$CONFLICTS"
                  continue
                fi
                if git ls-files -u -- "$F" | awk '$3==2{found=1} END{exit !found}'; then
                  git checkout --ours -- "$F" >/dev/null 2>&1 || true
                  git add -A -- "$F"
                  printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "CONFLICT_OURS_ADAPT_REQUIRED" "$SUBJECT" >> "$CONFLICTS"
                elif git ls-files -u -- "$F" | awk '$3==3{found=1} END{exit !found}'; then
                  git checkout --theirs -- "$F" >/dev/null 2>&1 || true
                  git add -A -- "$F"
                  printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "APPLIED_CONFLICT_NEW_FILE" "$SUBJECT" >> "$DECISIONS"
                else
                  restore_head_path "$F"
                  printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "CONFLICT_UNKNOWN" "$SUBJECT" >> "$CONFLICTS"
                fi
              done

              mapfile -t STAGED < <(git diff --cached --name-only)
              for F in "${STAGED[@]:-}"; do
                if is_duplicate_file_owner "$F"; then
                  restore_head_path "$F"
                  git add -A -- "$F" 2>/dev/null || true
                  printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "EXCLUDED_DUPLICATE_OWNER" "$SUBJECT" >> "$CONFLICTS"
                fi
              done

              git add -A
              normalize_new_migrations "$BRANCH" "$COMMIT"
              git add -A

              if git diff --cached --quiet; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "-" "NO_NET_CODE_CHANGE" "$SUBJECT" >> "$DECISIONS"
                git cherry-pick --quit >/dev/null 2>&1 || true
                git reset --hard HEAD >/dev/null
                git clean -fd >/dev/null
                continue
              fi

              mapfile -t RECEIVED < <(git diff --cached --name-only)
              git commit -m "feat(integration): selectively receive ${BRANCH} ${COMMIT:0:12}" \
                -m "Source subject: $SUBJECT" \
                -m "Granularity: commit and file; incompatible paths do not block other code. Feature status remains unchanged." >/dev/null
              for F in "${RECEIVED[@]}"; do
                printf '%s\t%s\t%s\t%s\t%s\n' "$BRANCH" "$COMMIT" "$F" "APPLIED_CODE" "$SUBJECT" >> "$DECISIONS"
              done
              git cherry-pick --quit >/dev/null 2>&1 || true
            done
          done

          INTEGRATION_HEAD="$(git rev-parse HEAD)"
          CHANGED_FILE_LIST="$LOG_DIR/changed-files.txt"
          git diff --name-only "$BASE..$INTEGRATION_HEAD" | sort -u > "$CHANGED_FILE_LIST"

          python3 - "$BASE" "$INTEGRATION_HEAD" "$DECISIONS" "$CONFLICTS" "$CHANGED_FILE_LIST" <<'PY'
          import csv, json, sys
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          base, head, decisions_p, conflicts_p, changed_p = sys.argv[1:]
          root = Path.cwd()
          rows = []
          for source, kind in [(decisions_p, "decision"), (conflicts_p, "conflict")]:
              for line in Path(source).read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  parts = line.split("\t", 4)
                  while len(parts) < 5:
                      parts.append("")
                  branch, commit, path, decision, subject = parts
                  rows.append({"branch": branch, "commit": commit, "path": path, "decision": decision, "subject": subject, "recordType": kind})

          changed = [x for x in Path(changed_p).read_text(encoding="utf-8").splitlines() if x]

          def feature(path: str, subject: str) -> str:
              v = (path + " " + subject).lower()
              import re
              m = re.search(r"f-(acc|cut|imp|int|proj|com|ins|ast)-(\d{3})", v)
              if m: return f"F-{m.group(1).upper()}-{m.group(2)}"
              if "satisfaction" in v or "满意度" in subject: return "F-ACC-002"
              if any(k in v for k in ("acceptancereport", "acceptanceactivity", "deliverable", "/acceptance/")): return "F-ACC-001"
              if "implementationreadiness" in v: return "F-IMP-001"
              if "arrival" in v or "到货" in subject: return "F-IMP-002"
              if any(k in v for k in ("deviceops", "device-ops", "collection", "credential")): return "F-INT-012"
              if "cutover" in v or "割接" in subject:
                  if "spare" in v or "备件" in subject: return "F-CUT-010"
                  if "reminder" in v or "leadtime" in v: return "F-CUT-008"
                  if "dashboard" in v or "kpi" in v: return "F-CUT-007"
                  if "closure" in v or "p6" in v: return "F-CUT-006"
                  if "approval" in v or "p5" in v: return "F-CUT-005"
                  if "plan" in v or "p4" in v: return "F-CUT-004"
                  if "checklist" in v or "p3" in v: return "F-CUT-003"
                  if "intake" in v or "assessment" in v or "taskv2" in v: return "F-CUT-002"
                  return "F-CUT-001"
              return "UNMAPPED"

          for row in rows:
              row["feature"] = feature(row["path"], row["subject"])

          applied_by_feature = defaultdict(set)
          for row in rows:
              if row["decision"].startswith("APPLIED") and row["path"] != "-":
                  applied_by_feature[row["feature"]].add(row["path"])

          marker = "## 代码事实选择性合入检查点（2026-09-03，ACC/INT/CUT三分支）"
          for feat, files in sorted(applied_by_feature.items()):
              task = root / "tasks/features" / f"{feat}.md"
              if feat == "UNMAPPED" or not task.exists() or not files:
                  continue
              text = task.read_text(encoding="utf-8")
              if marker in text:
                  continue
              branches = sorted({r["branch"] for r in rows if r["feature"] == feat and r["decision"].startswith("APPLIED")})
              block = ["", marker, "", "> 依据提交代码事实记录；Feature状态保持原值，代码接收不自动构成Implementation Done。", "", f"- 来源分支：{', '.join('`'+b+'`' for b in branches)}", f"- 本轮接收路径数：`{len(files)}`", "- 接收粒度：提交、文件；单个冲突或不符合文件不阻断同分支其他实现。", "- 冲突与适配项见 `docs/traceability/code-fact-three-branch-integration-2026-09-03.md`。", "", "已接收路径：", ""]
              block.extend(f"- `{p}`" for p in sorted(files)[:100])
              if len(files) > 100:
                  block.append(f"- 其余 `{len(files)-100}` 项见CSV/JSON清单。")
              task.write_text(text.rstrip() + "\n" + "\n".join(block) + "\n", encoding="utf-8")

          out_dir = root / "docs/traceability"
          out_dir.mkdir(parents=True, exist_ok=True)
          csv_path = out_dir / "code-fact-three-branch-integration-2026-09-03.csv"
          json_path = out_dir / "code-fact-three-branch-integration-2026-09-03.json"
          md_path = out_dir / "code-fact-three-branch-integration-2026-09-03.md"
          fields = ["branch", "commit", "feature", "path", "decision", "recordType", "subject"]
          with csv_path.open("w", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)
          json_path.write_text(json.dumps({"generatedAt": datetime.now(timezone.utc).isoformat(), "base": base, "head": head, "changedFiles": changed, "records": rows}, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          counts = Counter(r["decision"] for r in rows)
          fcounts = defaultdict(Counter)
          for r in rows: fcounts[r["feature"]][r["decision"]] += 1
          lines = ["# 三分支代码事实选择性合入报告", "", f"- 基线：`{base}`", f"- 代码整合Head：`{head}`", "- 来源：`codex/f-acc-001-sds`、`prereq-parallel-check-kKiAdn`、`codex/f-cut-001-matrices`", "- 原则：局部不符合项仅阻断对应文件；其他提交、文件继续接收。", "- Feature状态：保持原值；接收代码不自动提升Implementation Done。", "", "## 决策汇总", "", "| 决策 | 数量 |", "|---|---:|"]
          lines += [f"| `{k}` | {v} |" for k, v in sorted(counts.items())]
          lines += ["", "## Feature汇总", "", "| Feature | 已接收路径记录 | 冲突/适配记录 |", "|---|---:|---:|"]
          for feat in sorted(fcounts):
              applied = sum(v for k, v in fcounts[feat].items() if k.startswith("APPLIED"))
              conflicts = sum(v for k, v in fcounts[feat].items() if "CONFLICT" in k or "ADAPT" in k or "EXCLUDED_DUPLICATE" in k)
              lines.append(f"| {feat} | {applied} | {conflicts} |")
          lines += ["", "## 主干净新增/修改代码路径", ""]
          lines += [f"- `{p}`" for p in changed]
          lines += ["", "## 未自动接收项", "", "以下项只在对应文件/迁移层阻断，不构成整分支拒绝：", ""]
          for r in rows:
              if r["recordType"] == "conflict":
                  lines.append(f"- `{r['branch']}@{r['commit'][:12]}` `{r['path']}` — `{r['decision']}` — {r['subject']}")
          md_path.write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY

          git add -A tasks/features docs/traceability
          if [[ -f scripts/generate_requirement_traceability.py ]]; then
            set +e
            python3 scripts/generate_requirement_traceability.py > "$LOG_DIR/traceability.log" 2>&1
            TRACE_RC=$?
            set -e
            if (( TRACE_RC == 0 )); then
              git add docs/traceability/requirement-matrix.md docs/traceability/requirement-version-coverage.json
            fi
            {
              echo
              echo "## Requirement追溯生成"
              echo
              echo "- 退出码：\`$TRACE_RC\`"
              echo '```text'
              tail -100 "$LOG_DIR/traceability.log"
              echo '```'
            } >> docs/traceability/code-fact-three-branch-integration-2026-09-03.md
            git add docs/traceability/code-fact-three-branch-integration-2026-09-03.md
          fi

          set +e
          MVN_CMD="mvn"
          [[ -x ./mvnw ]] && MVN_CMD="./mvnw"
          $MVN_CMD -T 1C -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true \
            -pl pms-module-project,pms-module-cutover-api,pms-module-cutover,pms-module-engineering-api,pms-module-engineering,pms-module-integration,pms-module-platform,yudao-module-infra \
            -am package > "$LOG_DIR/maven.log" 2>&1
          MVN_RC=$?
          set -e
          {
            echo
            echo "## 主干适配构建"
            echo
            echo "- Maven退出码：\`$MVN_RC\`"
            echo '```text'
            tail -160 "$LOG_DIR/maven.log"
            echo '```'
          } >> docs/traceability/code-fact-three-branch-integration-2026-09-03.md
          git add docs/traceability/code-fact-three-branch-integration-2026-09-03.md

          git rm .github/workflows/code-fact-selective-integration.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs(traceability): update Feature and Requirement code-fact state" \
              -m "Record file-level reception from ACC, INT and CUT branches; keep incomplete Features in progress and preserve unresolved paths individually."
          fi

          git push origin HEAD:codex/code-fact-selective-integration-acc-int-cut-20260903
          echo "BASE=$BASE"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAVEN_RC=$MVN_RC"
