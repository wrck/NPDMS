name: "PR #7 exact test assertion repair (temporary)"

on:
  push:
    branches:
      - codex/code-fact-chronological-integration-acc-int-cut-20260904
    paths:
      - .github/workflows/pr7-one-shot-final-repair-20260904.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Replace only the reviewed device-scope assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pms-module-engineering/src/test/java/cn/iocoder/yudao/module/pms/engineering/service/arrivalacceptance/ArrivalAcceptanceApplicationServiceTest.java')
          text = p.read_text(encoding='utf-8')
          start = text.index('    void combinesCurrentAcceptedDeviceWithCurrentEffectiveExemption() {')
          end = text.index('\n    @Test', start)
          method = text[start:end]
          old = '        verify(fixture.devicePort(), never()).lockAndRevalidate(any(), any(), any());'
          new = '\n'.join([
              '        verify(fixture.devicePort()).lockAndRevalidate(1L, 100L, List.of(',
              '                new DeviceScopeFactPort.ExpectedDeviceFact(11L, "SN-1", 9L),',
              '                new DeviceScopeFactPort.ExpectedDeviceFact(12L, "SN-2", 10L)));',
          ])
          if method.count(old) != 1:
              raise SystemExit('Reviewed assertion has changed; stop without rewriting')
          text = text[:start] + method.replace(old, new) + text[end:]
          if text.count(old) != 1:
              raise SystemExit('Quantity-only no-AST assertion must remain unique')
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/pr7-one-shot-final-repair-20260904.yml .github/workflows/pr7-one-shot-gate-repair-20260904.yml
          git add pms-module-engineering/src/test/java/cn/iocoder/yudao/module/pms/engineering/service/arrivalacceptance/ArrivalAcceptanceApplicationServiceTest.java
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(engineering): assert frozen device locks and remove temporary repair workflows'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Preserve exact repaired source
        if: always()
        run: git bundle create "${RUNNER_TEMP}/pr7-repaired.bundle" HEAD refs/remotes/origin/master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-repaired-source
          path: ${{ runner.temp }}/pr7-repaired.bundle
          if-no-files-found: error
          retention-days: 7
