name: "PR #7 deterministic final repair"

on:
  push:
    branches:
      - codex/code-fact-chronological-integration-acc-int-cut-20260904
    paths:
      - .github/workflows/pr7-one-shot-final-repair-20260904.yml

permissions:
  contents: write

jobs:
  repair:
    name: Remove duplicated arrival fact contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove only exact duplicate test methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pms-module-engineering/src/test/java/cn/iocoder/yudao/module/pms/engineering/api/arrival/ArrivalAcceptanceFactApiImplTest.java")
          names = [
              "fullDeliveryScopeRejectsAcceptedOrExemptedQuantityOverflowBeforeProjection",
              "fullDeliveryScopeRejectsDeviceAndQuantityExemptionsOutsideCurrentAssignment",
              "validFactsInOtherAssignedSubscopeDoNotPolluteRequestedProjection",
              "quantityOnlyInspectAndLockUseStableEmptyDeviceWatermarkWithoutAstCalls",
          ]

          def locate_blocks(text: str, name: str) -> list[tuple[int, int, str]]:
              signature = f"    void {name}() {{"
              positions = []
              offset = 0
              while True:
                  pos = text.find(signature, offset)
                  if pos < 0:
                      break
                  positions.append(pos)
                  offset = pos + len(signature)

              blocks = []
              for pos in positions:
                  start = text.rfind("    @Test\n", 0, pos)
                  if start < 0:
                      raise SystemExit(f"{name}: missing @Test annotation")
                  opening = text.find("{", pos)
                  depth = 0
                  in_string = False
                  in_char = False
                  escaped = False
                  end = None
                  for index in range(opening, len(text)):
                      ch = text[index]
                      if escaped:
                          escaped = False
                          continue
                      if ch == "\\" and (in_string or in_char):
                          escaped = True
                          continue
                      if ch == '"' and not in_char:
                          in_string = not in_string
                          continue
                      if ch == "'" and not in_string:
                          in_char = not in_char
                          continue
                      if in_string or in_char:
                          continue
                      if ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = index + 1
                              while end < len(text) and text[end] == "\n":
                                  end += 1
                              break
                  if end is None:
                      raise SystemExit(f"{name}: unmatched method braces")
                  blocks.append((start, end, text[start:end]))
              return blocks

          text = path.read_text(encoding="utf-8")
          for name in names:
              blocks = locate_blocks(text, name)
              print(f"{name}: definitions={len(blocks)}")
              if len(blocks) == 1:
                  continue
              if len(blocks) != 2:
                  raise SystemExit(f"{name}: expected one or two definitions, found {len(blocks)}")
              if blocks[0][2] != blocks[1][2]:
                  raise SystemExit(f"{name}: duplicate definitions are not byte-identical")
              start, end, _ = blocks[1]
              text = text[:start] + text[end:]

          for name in names:
              if len(locate_blocks(text, name)) != 1:
                  raise SystemExit(f"{name}: deduplication postcondition failed")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          expected="pms-module-engineering/src/test/java/cn/iocoder/yudao/module/pms/engineering/api/arrival/ArrivalAcceptanceFactApiImplTest.java"
          [[ "${changed}" == "${expected}" ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${expected}"
          git diff --cached --check
          git commit -m "fix(engineering): remove duplicate arrival fact tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
