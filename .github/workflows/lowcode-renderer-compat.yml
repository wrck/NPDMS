name: Lowcode renderer compatibility

on:
  push:
    branches: [migration-sync-research-f36p0S]
    paths:
      - 'yudao-ui/yudao-ui-admin-vue3/**'
      - '.github/workflows/lowcode-renderer-compat.yml'
  pull_request:
    paths:
      - 'yudao-ui/yudao-ui-admin-vue3/src/components/LowCodeFormRenderer*/**'
      - 'yudao-ui/yudao-ui-admin-vue3/src/components/LowCodeTabRenderer/**'
      - 'yudao-ui/yudao-ui-admin-vue3/src/components/LowCodeRelatedPageRenderer/**'
      - 'yudao-ui/yudao-ui-admin-vue3/src/components/LowCodeListRenderer/**'
      - 'yudao-ui/yudao-ui-admin-vue3/src/views/lowcode/**'
      - 'yudao-ui/yudao-ui-admin-vue3/src/api/lowcode.ts'
      - 'yudao-ui/yudao-ui-admin-vue3/package.json'
      - 'yudao-ui/yudao-ui-admin-vue3/pnpm-lock.yaml'
      - '.github/workflows/lowcode-renderer-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lowcode-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yudao-ui/yudao-ui-admin-vue3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run V1 contracts, facade lifecycle and V2 adapter tests
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --config vitest.pms-file.config.ts \
            src/components/LowCodeFormRenderer \
            src/components/LowCodeFormRendererFacade \
            src/components/LowCodeFormRendererV2 \
            --reporter=default --reporter=junit \
            --outputFile.junit=artifacts/lowcode-compat.xml
      - name: Type-check frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run ts:check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowcode-renderer-compat-${{ github.sha }}
          path: yudao-ui/yudao-ui-admin-vue3/artifacts/lowcode-compat.xml
          if-no-files-found: warn
