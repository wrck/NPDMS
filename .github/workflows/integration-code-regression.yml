name: Integration code regression

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Full backend regression (Java 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Clean verify all reactor modules without stopping at the first failure
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -fae -DskipITs=true clean verify 2>&1 | tee "${RUNNER_TEMP}/backend.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/backend.log
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend unit and component regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install frozen dependencies
        working-directory: yudao-ui/yudao-ui-admin-vue3
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          pnpm install --frozen-lockfile
      - name: Run Node-native source contract tests
        working-directory: yudao-ui/yudao-ui-admin-vue3
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/theme-init.test.mjs \
            src/components/PmsLocationSelector/locationSelector.spec.ts \
            src/views/pms/asset/location/location-contract.spec.ts \
            src/views/pms/engineering/installation/installationForm.spec.ts \
            src/views/pms/project/projects/index.spec.ts 2>&1 | tee "${RUNNER_TEMP}/node-native-tests.log"
      - name: Run all Vitest unit and component tests
        working-directory: yudao-ui/yudao-ui-admin-vue3
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.pms-file.config.ts --reporter=default --reporter=junit --outputFile.junit="${RUNNER_TEMP}/frontend-junit.xml" 2>&1 | tee "${RUNNER_TEMP}/frontend-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frontend-junit.xml
            ${{ runner.temp }}/frontend-tests.log
            ${{ runner.temp }}/node-native-tests.log
          if-no-files-found: error
          retention-days: 14

  governance:
    name: Python governance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validator dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Run all governance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee "${RUNNER_TEMP}/governance-tests.log"
      - name: Capture the exact source and history used for the tests
        if: always()
        run: |
          git rev-parse HEAD > "${RUNNER_TEMP}/tested-revision.txt"
          git bundle create "${RUNNER_TEMP}/tested-source.bundle" --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/governance-tests.log
            ${{ runner.temp }}/tested-revision.txt
            ${{ runner.temp }}/tested-source.bundle
          if-no-files-found: error
          retention-days: 14

  mysql:
    name: ACC IMP COM CUT INT owner MySQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NPDMS_DB_NAME: npdms
      NPDMS_DB_USER: root
      NPDMS_DB_PASSWORD: pr7-isolated-ci-only
      NPDMS_MYSQL_PORT: '13306'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start isolated MySQL 8.4 and execute the active migration sequence
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name npdms-regression-mysql -p 13306:3306 \
            -e MYSQL_ROOT_PASSWORD="${NPDMS_DB_PASSWORD}" -e MYSQL_DATABASE=npdms \
            mysql:8.4 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="${NPDMS_DB_PASSWORD}" npdms-regression-mysql \
              mysql -uroot -Nse 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" -eq 1
          python3 - <<'PY' > "${RUNNER_TEMP}/migration-paths.txt"
          from pathlib import Path
          import re
          paths = list(Path('sql/migrations').glob('V*__*.sql'))
          paths.sort(key=lambda path: int(re.fullmatch(r'V(\d+)__.+\.sql', path.name).group(1)))
          for path in paths:
              print(path)
          PY
          while IFS= read -r migration; do
            echo "Executing ${migration}" | tee -a "${RUNNER_TEMP}/mysql-migrations.log"
            docker exec -i -e MYSQL_PWD="${NPDMS_DB_PASSWORD}" npdms-regression-mysql \
              mysql -uroot --default-character-set=utf8mb4 npdms < "${migration}" \
              >> "${RUNNER_TEMP}/mysql-migrations.log" 2>&1
          done < "${RUNNER_TEMP}/migration-paths.txt"
      - name: Run real MySQL transactions, idempotency, concurrency and owner callback tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -fae \
            -pl pms-module-engineering,pms-module-cutover,pms-module-project,pms-module-commerce,pms-module-platform,pms-module-asset -am \
            -DskipITs=false \
            '-Dtest=*Arrival*MySql*,Facc001ApplicationMySqlIntegrationTest,SatisfactionResultSourceProjectionMySqlIntegrationTest,*Cutover*MySql*,DeviceScopeFactApiMySqlTest,DeviceCredentialMySqlTest,CollectionCallbackMySqlTest,CollectionTaskMySqlTest,PlatformMigrationEvidenceMySqlTest,Fcom001ApplicationMySqlIntegrationTest,CommerceAuthorityCandidateMySqlTest,CommerceAuthorityIngestMySqlTest' \
            -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee "${RUNNER_TEMP}/mysql-tests.log"
      - name: Reject missing or skipped database evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('.').glob('**/target/surefire-reports/TEST-*.xml'))
          counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in counts:
                  counts[key] += int(suite.get(key, '0'))
          print(counts)
          if counts['tests'] == 0 or any(counts[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('MySQL regression evidence is missing, failed, or skipped')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mysql-tests.log
            ${{ runner.temp }}/mysql-migrations.log
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove isolated database
        if: always()
        run: docker rm -f npdms-regression-mysql

  regression-gate:
    name: Integration code regression gate
    if: always()
    needs: [backend, frontend, governance, mysql]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every regression job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Regression gates are not satisfied: {failed}')
          PY
