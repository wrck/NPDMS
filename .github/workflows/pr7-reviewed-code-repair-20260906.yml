name: PR7 reviewed test harness repair (temporary)
on:
  push:
    branches: [codex/code-fact-chronological-integration-acc-int-cut-20260904]
    paths: [.github/workflows/pr7-reviewed-code-repair-20260906.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Apply the exact reviewed fixture and runner edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes = []
          def edit(name, replacements):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: expected exactly one reviewed match: {old}')
                  text = text.replace(old, new)
              changes.append((p, text))
          edit('pms-module-platform/src/test/java/cn/iocoder/yudao/module/pms/platform/service/collection/CollectionTaskMySqlTest.java', [
              ('import cn.iocoder.yudao.module.pms.platform.service.command.PlatformCommandExecutionApiImpl;', 'import cn.iocoder.yudao.module.pms.platform.service.command.PlatformCommandExecutionApiImpl;\nimport cn.iocoder.yudao.module.pms.platform.service.command.PlatformTransactionalOutboxWriter;'),
              ('PlatformCommandExecutionApiImpl.class, CollectionTaskService.class}', 'PlatformCommandExecutionApiImpl.class, PlatformTransactionalOutboxWriter.class, CollectionTaskService.class}')])
          edit('scripts/tests/test_fcom001_v126_migration.py', [
              ('V209__received_fcom001_stage_entry_acceptance_seed.sql', 'V162__fcom001_stage_entry_acceptance_seed.sql')])
          edit('scripts/tests/test_fcom001_v127_migration.py', [
              ('V210__received_fcom001_acceptance_identity_authorization_fix.sql', 'V163__fcom001_acceptance_identity_authorization_fix.sql'),
              ('V209__received_fcom001_stage_entry_acceptance_seed.sql', 'V162__fcom001_stage_entry_acceptance_seed.sql'),
              ("`updater` = 'fcom001_v127'", "`updater` = 'fcom001_v163'")])
          edit('yudao-ui/yudao-ui-admin-vue3/src/views/pms/project/projects/index.spec.ts', [
              ('keeps survey and installation location maintenance atomic and equipment location read-only', 'keeps legacy survey read-only, installation atomic and equipment location read-only'),
              ('    assert.match(surveySource, /locationMaintenance/)', '\n'.join([
                  '    assert.match(surveySource, /仅保留历史查询/)',
                  r"    assert.match(surveySource, /router\.push\('\/pms\/customer-asset\/asset-site'\)/)",
                  r'    assert.doesNotMatch(surveySource, /SiteSurveyApi\.(create|update|delete)/)']))])
          edit('yudao-ui/yudao-ui-admin-vue3/vitest.pms-file.config.ts', [
              ("import { defineConfig } from 'vitest/config'", "import { configDefaults, defineConfig } from 'vitest/config'"),
              ('  test: {', '\n'.join([
                  '  test: {',
                  '    // These source-contract suites use node:test and run separately in CI.',
                  '    exclude: [',
                  '      ...configDefaults.exclude,',
                  "      'tests/theme-init.test.mjs',",
                  "      'src/components/PmsLocationSelector/locationSelector.spec.ts',",
                  "      'src/views/pms/asset/location/location-contract.spec.ts',",
                  "      'src/views/pms/engineering/installation/installationForm.spec.ts',",
                  "      'src/views/pms/project/projects/index.spec.ts'",
                  '    ],']))])
          edit('.github/workflows/integration-code-regression.yml', [
              ('name: Run theme initialization tests', 'name: Run Node-native source contract tests'),
              ('run: node --test tests/theme-init.test.mjs', '\n'.join([
                  'run: |',
                  '          node --experimental-strip-types --test tests/theme-init.test.mjs \\',
                  '            src/components/PmsLocationSelector/locationSelector.spec.ts \\',
                  '            src/views/pms/asset/location/location-contract.spec.ts \\',
                  '            src/views/pms/engineering/installation/installationForm.spec.ts \\',
                  '            src/views/pms/project/projects/index.spec.ts']))])
          for p, text in changes:
              p.write_text(text, encoding='utf-8')
          PY
          python3 -m unittest discover -s scripts/tests -p 'test_fcom001_v1*'
          node --experimental-strip-types --test \
            yudao-ui/yudao-ui-admin-vue3/tests/theme-init.test.mjs \
            yudao-ui/yudao-ui-admin-vue3/src/components/PmsLocationSelector/locationSelector.spec.ts \
            yudao-ui/yudao-ui-admin-vue3/src/views/pms/asset/location/location-contract.spec.ts \
            yudao-ui/yudao-ui-admin-vue3/src/views/pms/engineering/installation/installationForm.spec.ts \
            yudao-ui/yudao-ui-admin-vue3/src/views/pms/project/projects/index.spec.ts
          git add pms-module-platform/src/test/java/cn/iocoder/yudao/module/pms/platform/service/collection/CollectionTaskMySqlTest.java \
            scripts/tests/test_fcom001_v126_migration.py scripts/tests/test_fcom001_v127_migration.py \
            yudao-ui/yudao-ui-admin-vue3/src/views/pms/project/projects/index.spec.ts \
            yudao-ui/yudao-ui-admin-vue3/vitest.pms-file.config.ts .github/workflows/integration-code-regression.yml
          git rm .github/workflows/pr7-reviewed-code-repair-20260906.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(integration): restore real outbox fixture and split native frontend runners'
          git push origin "HEAD:${GITHUB_REF_NAME}"
