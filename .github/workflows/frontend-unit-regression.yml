name: Complete frontend unit regression

on:
  push:
    branches: [migration-sync-research-f36p0S]
    paths:
      - 'yudao-ui/yudao-ui-admin-vue3/**'
      - '.github/workflows/frontend-unit-regression.yml'
  pull_request:
    paths:
      - 'yudao-ui/yudao-ui-admin-vue3/**'
      - '.github/workflows/frontend-unit-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yudao-ui/yudao-ui-admin-vue3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install frozen application dependencies
        id: install
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          mkdir -p artifacts
          pnpm install --frozen-lockfile > artifacts/unit-install.log 2>&1 || { tail -n 40 artifacts/unit-install.log; exit 1; }
      - name: Run all existing Node-native frontend suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          node --experimental-strip-types --test tests/theme-init.test.mjs \
            src/components/PmsLocationSelector/locationSelector.spec.ts \
            src/views/pms/asset/location/location-contract.spec.ts \
            src/views/pms/engineering/installation/installationForm.spec.ts \
            src/views/pms/project/projects/index.spec.ts > artifacts/frontend-native.log 2>&1
          result=$?
          grep -E 'not ok|# (tests|pass|fail|skipped)' artifacts/frontend-native.log || true
          exit "$result"
      - name: Run complete Vitest suite without path filters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          pnpm exec vitest run --config vitest.pms-file.config.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=artifacts/frontend-all.xml > artifacts/frontend-all.log 2>&1
          result=$?
          tail -n 12 artifacts/frontend-all.log
          exit "$result"
      - name: Summarize every failed test
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          report = Path('artifacts/frontend-all.xml')
          if report.exists():
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print('FAIL', case.get('classname'), '|', case.get('name'))
                      print((failure.get('message') or '')[:900])
                      text = failure.text or ''
                      print(text[:900])
                      locations = [line.strip() for line in text.splitlines() if re.search(r'\.(?:spec|test)\.[cm]?[jt]sx?[:(]', line)]
                      print('\n'.join(locations[-3:]))
          else:
              log = Path('artifacts/frontend-all.log')
              if log.exists():
                  print(log.read_text()[-6000:])
          native = Path('artifacts/frontend-native.log')
          if native.exists():
              for line in native.read_text().splitlines():
                  if re.match(r'\s*(not ok|error:|expected:|location:|# (tests|pass|fail|skipped))', line):
                      print(line[:700])
          PY
      - name: Upload full frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-regression-${{ github.sha }}
          path: |
            yudao-ui/yudao-ui-admin-vue3/artifacts/frontend-native.log
            yudao-ui/yudao-ui-admin-vue3/artifacts/frontend-all.log
            yudao-ui/yudao-ui-admin-vue3/artifacts/frontend-all.xml
            yudao-ui/yudao-ui-admin-vue3/artifacts/unit-install.log
          if-no-files-found: error
          retention-days: 14
