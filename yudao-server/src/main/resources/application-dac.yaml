# Optional profile: activate together with the environment profile (for example local,dac).
pms:
  integration:
    device-ops:
      enabled: true
      base-url: ${DEVICE_OPS_BASE_URL:http://10.210.0.11:48182}
      namespace: ${DEVICE_OPS_NAMESPACE:npdms}
      bearer-token: ${DEVICE_OPS_BEARER_TOKEN:}
      request-signing-key: ${DAC_REQUEST_SIGNING_KEY}
      callback-signing-key: ${DAC_CALLBACK_SIGNING_KEY}
      callback-url: ${DAC_CALLBACK_URL:http://10.210.0.11:58080/api/v1/pms/integration/device-ops/callbacks}
      command-timeout-seconds: 30
      # DAC applies this budget to the whole manual script, including every command and pagination.
      manual-execution-timeout-seconds: ${DAC_MANUAL_EXECUTION_TIMEOUT_SECONDS:600}
      parse-timeout-seconds: 30
      device-connect-timeout-seconds: 10
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
